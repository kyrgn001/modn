<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Родословная 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#292621;background:#05080b}
#ui{position:fixed;z-index:10;left:14px;right:14px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.panel{pointer-events:auto;background:#0d141bee;border:1px solid #1e2a35;border-radius:12px;padding:8px 10px;box-shadow:0 3px 16px #0009;color:#cfd8e0}
.title{font-weight:750;font-size:15px;color:#e8eef5}.sub,.stats{font-size:11px;color:#7d8a97}
input,button{font:inherit;color:#cfd8e0}
input[type=text]{width:180px;padding:8px;border:1px solid #2a3846;border-radius:8px;background:#0a1016}
input[type=range]{width:150px;vertical-align:middle}
button{padding:8px 10px;border:1px solid #2a3846;border-radius:8px;background:#111a23;cursor:pointer}
button:hover{background:#1a2733;border-color:#3a4d5e}#stats{margin-left:auto}
#info{position:fixed;z-index:12;right:14px;top:72px;width:340px;max-height:calc(100vh - 88px);overflow:auto;display:none}
#info h2{margin:0 0 6px;font-size:17px;color:#e8eef5}
.row{font-size:12px;padding:5px 0;border-bottom:1px solid #1e2a35;color:#b9c4cf}
.row b{display:inline-block;width:92px;color:#7d8a97}
.stats-block{margin-top:10px;padding-top:8px;border-top:1px solid #1e2a35;font-size:12px}
.stats-title{font-size:11px;color:#7d8a97;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px}
.stat-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0;line-height:1.3}
.stat-label{color:#8e9aa6;flex:0 0 auto}
.stat-value{text-align:right;flex:1 1 auto}
.stat-total{color:#5d6b78;font-size:10px;margin-left:4px}
.tree-list{font-size:11px;color:#9fb0bf;max-height:180px;overflow:auto;margin-top:6px;padding-left:6px}
.tree-list div{padding:2px 0;border-bottom:1px dotted #1e2a35;cursor:pointer}
.tree-list div:hover{color:#7fd4ff}
.route-list{max-height:340px;overflow:auto;margin-top:6px;padding-left:2px}
.route-row{padding:6px 8px;border-bottom:1px dotted #1e2a35;cursor:pointer;font-size:12px;color:#cfd8e0;line-height:1.4}
.route-row:hover{background:#141c26;color:#7fd4ff}
.route-step{display:inline-block;min-width:44px;font-size:10px;color:#5d6b78}
.route-name{color:#e8eef5;font-weight:600}
#tip{position:fixed;left:14px;bottom:13px;z-index:5;font-size:11px;color:#9fb0bf;background:#0b1116dd;border:1px solid #1e2a35;border-radius:8px;padding:7px 10px;max-width:60vw}
#routeTip{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:15;background:#0d141bee;border:1px solid #00e5ff;color:#00e5ff;padding:8px 16px;border-radius:10px;display:none;font-size:13px;box-shadow:0 4px 20px #00e5ff33}
#err{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#7a1e1e;color:#fff;padding:10px;font:12px monospace;display:none;max-height:40vh;overflow:auto;white-space:pre-wrap}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:20;background:#0d141bee;border:1px solid #1e2a35;color:#cfd8e0;padding:10px 16px;border-radius:10px;display:none;font-size:13px}
.zoomwrap{display:flex;align-items:center;gap:6px;font-size:11px;color:#7d8a97}
</style></head><body>
<div id="ui">
 <div class="panel"><div class="title">Родословная 3D</div><div class="sub">клик = облако родства · 🧭 = маршрут</div></div>
 <div class="panel">
   <input id="search" type="text" placeholder="Найти человека…">
   <button id="importBtn">📥 Импорт XLSX</button>
   <input id="fileInput" type="file" accept=".xlsx,.xls" style="display:none">
   <button id="routeBtn">🧭 Маршрут родства</button>
   <button id="resetData">Сброс к встроенным</button>
   <button id="fit">Вписать</button><button id="reset">Сброс вида</button><button id="top">Сверху</button>
   <button id="save">Сохранить позиции</button><button id="clear">Сброс позиций</button>
   <span class="zoomwrap">Масштаб <input id="zoomRange" type="range" min="10" max="300" value="100"><span id="zoomVal">100%</span></span>
 </div>
 <div id="stats" class="panel stats">—</div>
</div>
<div id="routeTip"></div>
<div id="info" class="panel"></div>
<div id="tip">🖱 ЛКМ по фону — вращение · по шару — тянуть ветку · колесо/ползунок — зум · ПКМ — сдвиг · 🧭 — маршрут между двумя людьми</div>
<div id="toast"></div>
<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
window.addEventListener('error',e=>{
  const el=document.getElementById('err');el.style.display='block';
  el.textContent+='[ERR] '+(e.message||e.error)+' @ '+(e.filename||'')+':'+(e.lineno||'')+'\n';
});
function toast(msg,ms){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms||2500);
}
</script>

<script>
// ============================================================
//  ОСНОВНАЯ ЛОГИКА
// ============================================================
(function(){
try{
  if(typeof THREE==='undefined')throw new Error('Three.js не загрузился');
  if(!THREE.OrbitControls)throw new Error('OrbitControls не загрузился');
  if(typeof XLSX==='undefined')console.warn('SheetJS не загрузился — импорт XLSX не будет работать');

  // ---------- ГЛОБАЛЬНЫЕ ----------
  let P=[],M=new Map(),CH=new Map(),L=new Map();
  let maxLevel=0;
  let positions=new Map();
  let spheres=new Map();
  let labels=new Map();
  let edgeDefs=[];
  let lineObjects=[];

  const KEY_DATA="rod_data_v1";
  const KEY_POS ="rod_3d_positions_v9";
  let savedPositions={};
  try{savedPositions=JSON.parse(localStorage.getItem(KEY_POS)||"{}")}catch(e){}

  const nm=p=>[p.Фамилия,p.Имя,p.Отчество].filter(Boolean).join(" ")||("ID "+p.ID);
  const par=p=>[p.father,p.mother].filter(x=>x!=null&&M.has(x));

  function buildGraph(arr){
    P=arr.map(p=>({...p,
      ID:parseInt(p.ID,10),
      father:p["ID Отца"]?parseInt(p["ID Отца"],10):null,
      mother:p["ID Матери"]?parseInt(p["ID Матери"],10):null
    })).filter(p=>!isNaN(p.ID));
    M=new Map();P.forEach(p=>M.set(p.ID,p));
    CH=new Map();
    P.forEach(p=>{
      [p.father,p.mother].forEach(x=>{
        if(x!=null&&M.has(x)){
          if(!CH.has(x))CH.set(x,[]);
          CH.get(x).push(p.ID);
        }
      });
    });
    L=new Map();
    P.filter(p=>!par(p).length).forEach(p=>L.set(p.ID,0));
    for(let k=0;k<P.length;k++){
      let z=0;
      P.forEach(p=>{
        const a=par(p).filter(x=>L.has(x));
        if(a.length){
          const v=Math.max(...a.map(x=>L.get(x)))+1;
          if(!L.has(p.ID)||v>L.get(p.ID)){L.set(p.ID,v);z=1}
        }
      });
      if(!z)break;
    }
    P.forEach(p=>{if(!L.has(p.ID))L.set(p.ID,0)});
    maxLevel=Math.max(...[...L.values()],0);
  }

  // ---------- сцена ----------
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x02060a);
  scene.fog=new THREE.FogExp2(0x02060a,0.00022);

  const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,30000);
  camera.position.set(0,700,1600);

  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  document.body.appendChild(renderer.domElement);

  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=0.08;
  controls.maxDistance=20000;controls.minDistance=60;

  scene.add(new THREE.AmbientLight(0xffffff,0.8));
  const dl=new THREE.DirectionalLight(0xffffff,0.6);dl.position.set(600,1200,800);scene.add(dl);
  const dl2=new THREE.DirectionalLight(0x86b7ff,0.35);dl2.position.set(-600,600,-800);scene.add(dl2);

  const sphereGeo=new THREE.SphereGeometry(1,20,16);
  const haloCanvas=document.createElement('canvas');
  haloCanvas.width=128;haloCanvas.height=128;
  {
    const g=haloCanvas.getContext('2d');
    const grad=g.createRadialGradient(64,64,2,64,64,62);
    grad.addColorStop(0,'rgba(255,255,255,0.9)');
    grad.addColorStop(0.4,'rgba(255,255,255,0.25)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=grad;g.fillRect(0,0,128,128);
  }
  const haloTex=new THREE.CanvasTexture(haloCanvas);
  haloTex.minFilter=THREE.LinearFilter;

  let spheresGroup=new THREE.Group();
  let labelsGroup=new THREE.Group();
  let edgesGroup=new THREE.Group();
  let starsGroup=new THREE.Group();
  scene.add(spheresGroup);scene.add(labelsGroup);scene.add(edgesGroup);scene.add(starsGroup);

  // ---------- ЗВЁЗДНЫЙ ФОН ----------
  function buildStars(){
    while(starsGroup.children.length){
      const c=starsGroup.children.pop();
      if(c.geometry&&c.geometry!==sphereGeo)c.geometry.dispose();
      if(c.material)c.material.dispose();
      starsGroup.remove(c);
    }
    const N=900;
    for(let i=0;i<N;i++){
      const r=400+Math.random()*4200;
      const theta=Math.random()*Math.PI*2;
      const phi=Math.acos(2*Math.random()-1);
      const x=r*Math.sin(phi)*Math.cos(theta);
      const y=r*Math.cos(phi)*0.7;
      const z=r*Math.sin(phi)*Math.sin(theta);
      const size=0.8+Math.random()*2.2;
      const c=new THREE.Color().setHSL(0.62,0.05,0.55+Math.random()*0.35);
      const mat=new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.5+Math.random()*0.5});
      const m=new THREE.Mesh(sphereGeo,mat);
      m.scale.set(size,size,size);
      m.position.set(x,y,z);
      starsGroup.add(m);
    }
  }
  buildStars();

  // ---------- ЦВЕТА / РАЗМЕРЫ ----------
  function sphereColor(p){
    const lv=L.get(p.ID)||0;
    const t=maxLevel?lv/maxLevel:0;
    const c=new THREE.Color();
    if(p.Пол==="М")c.setHSL(0.58-t*0.08,0.75,0.58-t*0.08);
    else if(p.Пол==="Ж")c.setHSL(0.92-t*0.06,0.75,0.60-t*0.08);
    else c.setHSL(0.10,0.30,0.60-t*0.05);
    return c;
  }
  function radiusOf(p){
    const kids=(CH.get(p.ID)||[]).length;
    let base=12+Math.min(kids,6)*1.6;
    const lv=L.get(p.ID)||0;
    base-=lv*0.4;
    return Math.max(7,base);
  }

  // ---------- «ЛУКОВИЦА»: СТАРШИЕ В ЦЕНТРЕ, МЛАДШИЕ НАРУЖУ ----------
  function computeLayout(){
    positions=new Map();

    const RX = 1300;
    const RY = 900;
    const RZ = 900;
    const CORE_R = 0.15;

    const totalLevels = maxLevel + 1;

    const byLevel=new Map();
    P.forEach(p=>{
      const lv=L.get(p.ID)||0;
      if(!byLevel.has(lv))byLevel.set(lv,[]);
      byLevel.get(lv).push(p);
    });

    function radiusFactor(lv){
      if(totalLevels<=1)return 1;
      const t = lv/(totalLevels-1);
      return CORE_R + (1 - CORE_R)*t;
    }

    const placedPos=new Map();
    const levelsSorted=[...byLevel.keys()].sort((a,b)=>a-b);

    levelsSorted.forEach(lv=>{
      const arr=byLevel.get(lv).slice();

      arr.forEach(p=>{
        const parents=[p.father,p.mother].filter(x=>x!=null&&placedPos.has(x));
        if(parents.length){
          let sx=0,sy=0,sz=0;
          parents.forEach(pid=>{const v=placedPos.get(pid);sx+=v.x;sy+=v.y;sz+=v.z});
          const v=new THREE.Vector3(sx,sy,sz).normalize();
          p._dirX=v.x;p._dirY=v.y;p._dirZ=v.z;
          p._hasDir=true;
        } else {
          p._hasDir=false;
        }
      });

      const N=arr.length;
      const RING_CAP = Math.max(20, Math.ceil(N/3));

      arr.sort((a,b)=>{
        if(!a._hasDir&&!b._hasDir)return a.ID-b.ID;
        if(!a._hasDir)return 1;
        if(!b._hasDir)return -1;
        const fa=Math.atan2(a._dirZ,a._dirX);
        const fb=Math.atan2(b._dirZ,b._dirX);
        if(Math.abs(fa-fb)>0.01)return fa-fb;
        return a._dirY-b._dirY;
      });

      const rings=[];
      for(let i=0;i<N;i+=RING_CAP)rings.push(arr.slice(i,i+RING_CAP));

      rings.forEach((ring,ri)=>{
        const baseFactor=radiusFactor(lv);
        const ringFactor=Math.min(1, baseFactor + (ri*0.06)/Math.max(1,totalLevels));

        const rx=RX*ringFactor;
        const ry=RY*ringFactor;
        const rz=RZ*ringFactor;

        const n=ring.length;
        ring.forEach((p,i)=>{
          const phi = (i/Math.max(1,n))*Math.PI*2 + lv*0.7 + ri*1.3;
          const t = ((i*2654435761)>>>0)/4294967296;
          const theta = (t-0.5)*1.2;

          let px=rx*Math.cos(theta)*Math.cos(phi);
          let py=ry*Math.sin(theta);
          let pz=rz*Math.cos(theta)*Math.sin(phi);

          if(p._hasDir){
            const pull=0.35;
            px=px*(1-pull) + (p._dirX*RX*ringFactor)*pull;
            py=py*(1-pull) + (p._dirY*RY*ringFactor)*pull;
            pz=pz*(1-pull) + (p._dirZ*RZ*ringFactor)*pull;
          }

          const jx=(Math.random()-0.5)*60;
          const jy=(Math.random()-0.5)*60;
          const jz=(Math.random()-0.5)*60;

          const v=new THREE.Vector3(px+jx, py+jy, pz+jz);
          positions.set(p.ID, v);
          placedPos.set(p.ID, v);
        });
      });
    });

    P.forEach(p=>{
      if(!positions.has(p.ID)){
        const v=new THREE.Vector3(
          (Math.random()-0.5)*RX,
          (Math.random()-0.5)*RY,
          (Math.random()-0.5)*RZ
        );
        positions.set(p.ID, v);
      }
    });

    P.forEach(p=>{
      const s=savedPositions[p.ID];
      if(s&&typeof s.x==="number")positions.set(p.ID,new THREE.Vector3(s.x,s.y,s.z));
    });

    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity,minZ=Infinity,maxZ=-Infinity;
    positions.forEach(v=>{
      minX=Math.min(minX,v.x);maxX=Math.max(maxX,v.x);
      minY=Math.min(minY,v.y);maxY=Math.max(maxY,v.y);
      minZ=Math.min(minZ,v.z);maxZ=Math.max(maxZ,v.z);
    });
    const cx=(minX+maxX)/2, cy=(minY+maxY)/2, cz=(minZ+maxZ)/2;
    positions.forEach(v=>{v.x-=cx;v.y-=cy;v.z-=cz});
  }

  // ---------- СЦЕНА: ШАРЫ ----------
  function buildScene(){
    [spheresGroup,labelsGroup,edgesGroup].forEach(g=>{
      while(g.children.length){
        const c=g.children.pop();
        if(c.geometry&&c.geometry!==sphereGeo)c.geometry.dispose();
        if(c.material&&c.material.map&&c.material.map!==haloTex)c.material.map.dispose();
        if(c.material)c.material.dispose();
        g.remove(c);
      }
    });
    spheres=new Map();labels=new Map();lineObjects=[];

    P.forEach(p=>{
      const pos=positions.get(p.ID);if(!pos)return;
      const r=radiusOf(p);
      const col=sphereColor(p);
      const mat=new THREE.MeshPhongMaterial({
        color:col,
        emissive:col.clone().multiplyScalar(0.35),
        shininess:40,
        transparent:false
      });
      const m=new THREE.Mesh(sphereGeo,mat);
      m.scale.set(r,r,r);m.position.copy(pos);
      m.userData.id=p.ID;m.userData.baseScale=r;
      m.userData.baseColor=col.clone();
      spheresGroup.add(m);spheres.set(p.ID,m);

      const cvs=document.createElement('canvas');
      cvs.width=512;cvs.height=64;
      const ctx=cvs.getContext('2d');
      ctx.font='bold 26px -apple-system,Segoe UI,Arial';
      ctx.fillStyle='#ffffff';ctx.textBaseline='middle';
      const full=nm(p);
      ctx.fillText(full.length>28?full.slice(0,27)+'…':full,8,32);
      const tex=new THREE.CanvasTexture(cvs);
      tex.minFilter=THREE.LinearFilter;
      const smat=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false,opacity:0.85});
      const spr=new THREE.Sprite(smat);
      spr.scale.set(110,14,1);
      spr.position.copy(pos.clone().add(new THREE.Vector3(0,r+18,0)));
      spr.userData.id=p.ID;
      labelsGroup.add(spr);labels.set(p.ID,spr);

      const hmat=new THREE.SpriteMaterial({
        map:haloTex,color:col.clone().multiplyScalar(1.4),
        transparent:true,opacity:0.55,
        blending:THREE.AdditiveBlending,depthWrite:false
      });
      const hs=new THREE.Sprite(hmat);
      hs.scale.set(r*6,r*6,1);
      hs.position.copy(pos);
      hs.userData.id=p.ID;
      p._halo=hs;
      spheresGroup.add(hs);
    });

    edgeDefs=[];
    P.forEach(c=>{par(c).forEach(pid=>edgeDefs.push({from:pid,to:c.ID,type:'parent'}))});
    const spouseSet=new Set();
    P.forEach(c=>{
      if(c.father&&c.mother){
        const k=Math.min(c.father,c.mother)+"_"+Math.max(c.father,c.mother);
        if(!spouseSet.has(k)){spouseSet.add(k);edgeDefs.push({from:c.father,to:c.mother,type:'spouse'})}
      }
    });
    rebuildEdges();

    document.getElementById('stats').textContent=P.length+' человек · '+(maxLevel+1)+' поколений · '+edgeDefs.length+' связей';
  }

  // ---------- ПРОСТАЯ ПРЯМАЯ ЛИНИЯ ----------
  function createRiverEdge(a,b,type){
    const group=new THREE.Group();
    const col=new THREE.Color(type==='spouse'?0xff6ab0:0x59a9ff);
    const opacity=type==='spouse'?0.35:0.5;

    const dir=b.clone().sub(a);
    const len=dir.length();
    if(len<1)return group;
    const unit=dir.clone().normalize();

    const R=10;
    const aSurf=a.clone().add(unit.clone().multiplyScalar(R));
    const bSurf=b.clone().sub(unit.clone().multiplyScalar(R));

    const geo=new THREE.BufferGeometry().setFromPoints([aSurf,bSurf]);
    const mat=new THREE.LineBasicMaterial({
      color:col,transparent:true,opacity:opacity,
      blending:THREE.AdditiveBlending,depthWrite:false
    });
    const line=new THREE.Line(geo,mat);
    group.add(line);

    return group;
  }

  function rebuildEdges(){
    while(edgesGroup.children.length){
      const c=edgesGroup.children.pop();
      c.traverse(o=>{
        if(o.geometry)o.geometry.dispose();
        if(o.material)o.material.dispose();
      });
      edgesGroup.remove(c);
    }
    lineObjects=[];
    edgeDefs.forEach(def=>{
      const a=positions.get(def.from),b=positions.get(def.to);
      if(!a||!b)return;
      const g=createRiverEdge(a.clone(),b.clone(),def.type);
      g.userData={def};
      g.traverse(o=>{
        if(o.material){
          o.userData._baseColor=o.material.color.clone();
          o.userData._baseOpacity=o.material.opacity;
        }
      });
      edgesGroup.add(g);
      lineObjects.push(g);
    });
  }

  // ---------- DRAG / CLICK ----------
  const raycaster=new THREE.Raycaster();
  const mouse=new THREE.Vector2();
  let downPos=null,dragState=null;
  const plane=new THREE.Plane();

  function descendants(id){
    const out=new Set(),q=[id];
    while(q.length){
      const x=q.pop();
      (CH.get(x)||[]).forEach(k=>{if(!out.has(k)){out.add(k);q.push(k)}});
    }
    return out;
  }
  function ancestors(id){
    const out=new Set(),q=[id];
    while(q.length){
      const x=q.pop();const p=M.get(x);if(!p)continue;
      [p.father,p.mother].forEach(pp=>{
        if(pp!=null&&M.has(pp)&&!out.has(pp)){out.add(pp);q.push(pp)}
      });
    }
    return out;
  }
  function bloodCloud(id){
    const s=new Set([id]);
    ancestors(id).forEach(a=>s.add(a));
    descendants(id).forEach(d=>s.add(d));
    return s;
  }
  function inLawCloud(id){
    const cloud=bloodCloud(id);
    const inLaws=new Set();
    (CH.get(id)||[]).forEach(k=>{
      const kp=M.get(k);if(!kp)return;
      [kp.father,kp.mother].forEach(pp=>{
        if(pp!=null&&M.has(pp)&&!cloud.has(pp))inLaws.add(pp);
      });
    });
    return inLaws;
  }
  function inLawAncestors(id){
    const inLaws = inLawCloud(id);
    const out = new Set();
    inLaws.forEach(lawId=>{
      ancestors(lawId).forEach(a=>{
        if(!out.has(a)) out.add(a);
      });
    });
    const ownBlood = new Set([id, ...ancestors(id), ...descendants(id), ...inLaws]);
    const filtered = new Set();
    out.forEach(a=>{
      if(!ownBlood.has(a)) filtered.add(a);
    });
    return filtered;
  }

  function rayToPlaneScreen(px,py,point){
    mouse.x=(px/innerWidth)*2-1;
    mouse.y=-(py/innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const camDir=new THREE.Vector3();
    camera.getWorldDirection(camDir);
    plane.setFromNormalAndCoplanarPoint(camDir,point);
    const hit=new THREE.Vector3();
    return raycaster.ray.intersectPlane(plane,hit)?hit:null;
  }

  function getSpheresArray(){
    return P.map(p=>spheres.get(p.ID)).filter(Boolean);
  }

  const dom=renderer.domElement;
  dom.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    downPos={x:e.clientX,y:e.clientY};
  });
  dom.addEventListener('pointermove',e=>{
    if(!downPos)return;
    const moved=Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y);
    if(!dragState){
      if(moved<4)return;
      mouse.x=(downPos.x/innerWidth)*2-1;
      mouse.y=-(downPos.y/innerHeight)*2+1;
      raycaster.setFromCamera(mouse,camera);
      const hits=raycaster.intersectObjects(getSpheresArray(),false);
      if(hits.length){
        const id=hits[0].object.userData.id;
        const ids=[id,...descendants(id)];
        const base=new Map();
        ids.forEach(i=>{if(positions.has(i))base.set(i,positions.get(i).clone())});
        dragState={ids,base,start:positions.get(id).clone()};
        controls.enabled=false;
      } else {downPos=null;return}
    }
    if(dragState){
      const hit=rayToPlaneScreen(e.clientX,e.clientY,dragState.start);
      if(!hit)return;
      const offset=hit.clone().sub(dragState.start);
      dragState.base.forEach((v,id)=>{
        const nv=v.clone().add(offset);
        positions.get(id).copy(nv);
        const sp=spheres.get(id);if(sp)sp.position.copy(nv);
        const lb=labels.get(id);if(lb){const r=radiusOf(M.get(id));lb.position.copy(nv.clone().add(new THREE.Vector3(0,r+18,0)))}
        const p=M.get(id);if(p&&p._halo)p._halo.position.copy(nv);
      });
      rebuildEdges();
    }
  });
  function endDrag(e){
    if(dragState){
      const dump={};positions.forEach((v,k)=>{dump[k]={x:v.x,y:v.y,z:v.z}});
      try{localStorage.setItem(KEY_POS,JSON.stringify(dump))}catch(_){}
      dragState=null;controls.enabled=true;
    }
    if(downPos&&e){
      const dx=e.clientX-downPos.x,dy=e.clientY-downPos.y;
      if(dx*dx+dy*dy<25){
        mouse.x=(e.clientX/innerWidth)*2-1;
        mouse.y=-(e.clientY/innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        const hits=raycaster.intersectObjects(getSpheresArray(),false);
        if(hits.length){
          const clickedId = hits[0].object.userData.id;
          if(routeMode){
            routeClick(clickedId);
          } else {
            select(clickedId);
          }
        }
        else if(!routeMode){
          deselect();
        }
      }
    }
    downPos=null;
  }
  dom.addEventListener('pointerup',endDrag);
  dom.addEventListener('pointercancel',endDrag);
  dom.addEventListener('pointerleave',endDrag);

  function highlightSubtree(id){
    clearHighlight();

    const anc     = ancestors(id);
    const desc    = descendants(id);
    const inLaws  = inLawCloud(id);
    const lawAnc  = inLawAncestors(id);

    const all = new Set([id, ...anc, ...desc, ...inLaws, ...lawAnc]);

    spheres.forEach((m,mid)=>{
      const p=M.get(mid);

    spheres.forEach((m,mid)=>{
      const p=M.get(mid);

      if(mid===id){
        m.material.color.set(COLOR.selected);

        m.material.emissiveIntensity=1.6;
        const s=m.userData.baseScale;m.scale.set(s*1.6,s*1.6,s*1.6);
        const lb=labels.get(mid);if(lb)lb.material.opacity=1;
        if(halo){halo.material.opacity=1;halo.material.color.set(COLOR.selectedGlow)}
      }
      else if(anc.has(mid)){
        m.material.color.copy(m.userData.baseColor);
        m.material.emissive.set(COLOR.ancEmissive);
        m.material.emissiveIntensity=1.1;
        const s=m.userData.baseScale;m.scale.set(s*1.18,s*1.18,s*1.18);
        const lb=labels.get(mid);if(lb)lb.material.opacity=1;
        if(halo){halo.material.opacity=1;halo.material.color.set(COLOR.ancGlow)}
      }
      else if(desc.has(mid)){
        m.material.color.copy(m.userData.baseColor);
        m.material.emissive.set(COLOR.descEmissive);
        m.material.emissiveIntensity=1.1;
        const s=m.userData.baseScale;m.scale.set(s*1.28,s*1.28,s*1.28);
        const lb=labels.get(mid);if(lb)lb.material.opacity=1;
        if(halo){halo.material.opacity=1;halo.material.color.set(COLOR.descGlow)}
      }
      else if(inLaws.has(mid)){
        m.material.color.copy(m.userData.baseColor);
        m.material.emissive.set(COLOR.lawEmissive);
        m.material.emissiveIntensity=1.0;
        const s=m.userData.baseScale;m.scale.set(s*1.15,s*1.15,s*1.15);
        const lb=labels.get(mid);if(lb)lb.material.opacity=1;
        if(halo){halo.material.opacity=0.95;halo.material.color.set(COLOR.lawGlow)}
      }
      else if(lawAnc.has(mid)){
        m.material.color.copy(m.userData.baseColor);
        m.material.emissive.set(COLOR.lawAncEmissive);
        m.material.emissiveIntensity=0.95;
        const s=m.userData.baseScale;m.scale.set(s*1.1,s*1.1,s*1.1);
        const lb=labels.get(mid);if(lb)lb.material.opacity=0.98;
        if(halo){halo.material.opacity=0.9;halo.material.color.set(COLOR.lawAncGlow)}
      }
      else {
        m.material.color.copy(m.userData.baseColor);
        m.material.emissive.copy(m.userData.baseColor.clone().multiplyScalar(0.03));
        m.material.emissiveIntensity=1;
        m.material.transparent=true;m.material.opacity=0.07;
        const s=m.userData.baseScale;m.scale.set(s,s,s);
        const lb=labels.get(mid);if(lb)lb.material.opacity=0.08;
        if(halo)halo.material.opacity=0.02;
      }
    });

    lineObjects.forEach(g=>{
      const {from,to,type}=g.userData.def;
      const inFrom = all.has(from);
      const inTo   = all.has(to);
      const inCloud = inFrom && inTo;

      g.traverse(o=>{
        if(!o.material||!o.userData._baseColor)return;

        if(!inCloud){
          o.material.color.set(COLOR.lineFaded);
          o.material.opacity=0.04;
          return;
        }

        const touchesSelected = (from===id||to===id);
        if(touchesSelected){
          o.material.color.set(0xffffff);
          o.material.opacity=1;
          return;
        }

        if(type==='spouse'){
          o.material.color.set(0xff66b8);
          o.material.opacity=1;
          return;
        }

        const fromAnc = anc.has(from);
        const toAnc   = anc.has(to);
        const fromDesc= desc.has(from);
        const toDesc  = desc.has(to);
        const fromLaw = inLaws.has(from) || lawAnc.has(from);
        const toLaw   = inLaws.has(to)   || lawAnc.has(to);

        if(fromAnc && toAnc){
          o.material.color.set(COLOR.lineAnc);
          o.material.opacity=1;
        }
        else if(fromDesc && toDesc){
          o.material.color.set(COLOR.lineDesc);
          o.material.opacity=1;
        }
        else if(fromLaw && toLaw){
          o.material.color.set(COLOR.lineLawAnc);
          o.material.opacity=1;
        }
        else if(fromAnc || toAnc){
          o.material.color.set(COLOR.lineTransAnc);
          o.material.opacity=0.95;
        }
        else if(fromDesc || toDesc){
          o.material.color.set(COLOR.lineTransDesc);
          o.material.opacity=0.95;
        }
        else if(fromLaw || toLaw){
          o.material.color.set(COLOR.lineTransLaw);
          o.material.opacity=0.9;
        }
        else {
          o.material.color.set(0xdddddd);
          o.material.opacity=0.5;
        }
      });
    });
  }

  // ---------- МАРШРУТ МЕЖДУ ДВУМЯ ЛЮДЬМИ ----------
  function buildUndirectedGraph(){
    const adj = new Map();
    P.forEach(p=>{ if(!adj.has(p.ID)) adj.set(p.ID, new Set()); });
    P.forEach(p=>{
      [p.father,p.mother].forEach(pid=>{
        if(pid!=null&&M.has(pid)){
          adj.get(p.ID).add(pid);
          adj.get(pid).add(p.ID);
        }
      });
      if(p.father&&p.mother&&M.has(p.father)&&M.has(p.mother)){
        adj.get(p.father).add(p.mother);
        adj.get(p.mother).add(p.father);
      }
    });
    return adj;
  }

  function findPath(startId, endId){
    if(startId===endId) return [startId];
    const adj = buildUndirectedGraph();
    if(!adj.has(startId)||!adj.has(endId)) return null;

    const prev = new Map();
    prev.set(startId, null);
    const queue = [startId];

    while(queue.length){
      const cur = queue.shift();
      if(cur===endId) break;
      const neigh = adj.get(cur)||new Set();
      for(const n of neigh){
        if(!prev.has(n)){
          prev.set(n, cur);
          queue.push(n);
        }
      }
    }

    if(!prev.has(endId)) return null;

    const path = [];
    let x = endId;
    while(x!=null){
      path.unshift(x);
      x = prev.get(x);
    }
    return path;
  }

  function describeStep(aId, bId){
    const a = M.get(aId), b = M.get(bId);
    if(!a||!b) return '';
    if(b.father===aId||b.mother===aId) return 'родитель →';
    if(a.father===bId||a.mother===bId) return '← ребёнок';
    const kidsA = new Set(CH.get(aId)||[]);
    const kidsB = new Set(CH.get(bId)||[]);
    let shared = false;
    kidsA.forEach(k=>{if(kidsB.has(k))shared=true});
    if(shared) return 'супруг(а)';
    return '—';
  }

  function highlightRoute(pathIds){
    clearHighlight();
    if(!pathIds||!pathIds.length) return;
    const routeSet = new Set(pathIds);
    const startId = pathIds[0];
    const endId   = pathIds[pathIds.length-1];

    spheres.forEach((m,mid)=>{
      const p=M.get(mid);
      const halo=p&&p._halo;
      if(mid===startId||mid===endId){
        m.material.color.set(COLOR.routeNode);
        m.material.emissive.set(COLOR.routeEmissive);
        m.material.emissiveIntensity=1.8;
        const s=m.userData.baseScale;m.scale.set(s*1.6,s*1.6,s*1.6);
        const lb=labels.get(mid);if(lb)lb.material.opacity=1;
        if(halo){halo.material.opacity=1;halo.material.color.set(COLOR.routeGlow)}
      }
      else if(routeSet.has(mid)){
        m.material.color.copy(m.userData.baseColor);
        m.material.emissive.set(COLOR.routeEmissive);
        m.material.emissiveIntensity=1.3;
        const s=m.userData.baseScale;m.scale.set(s*1.3,s*1.3,s*1.3);
        const lb=labels.get(mid);if(lb)lb.material.opacity=1;
        if(halo){halo.material.opacity=1;halo.material.color.set(COLOR.routeGlow)}
      }
      else {
        m.material.color.copy(m.userData.baseColor);
        m.material.emissive.copy(m.userData.baseColor.clone().multiplyScalar(0.03));
        m.material.emissiveIntensity=1;
        m.material.transparent=true;m.material.opacity=0.06;
        const s=m.userData.baseScale;m.scale.set(s,s,s);
        const lb=labels.get(mid);if(lb)lb.material.opacity=0.06;
        if(halo)halo.material.opacity=0.02;
      }
    });

    const pairs = new Set();
    for(let i=0;i<pathIds.length-1;i++){
      const a=pathIds[i], b=pathIds[i+1];
      pairs.add(a+'_'+b);
      pairs.add(b+'_'+a);
    }

    lineObjects.forEach(g=>{
      const {from,to}=g.userData.def;
      const onRoute = pairs.has(from+'_'+to) || pairs.has(to+'_'+from);
      g.traverse(o=>{
        if(!o.material||!o.userData._baseColor)return;
        if(onRoute){
          o.material.color.set(COLOR.routeLine);
          o.material.opacity=1;
        } else {
          o.material.color.set(COLOR.lineFaded);
          o.material.opacity=0.03;
        }
      });
    });
  }

  // ---------- СОСТОЯНИЕ МАРШРУТА ----------
  let routeMode = false;
  let routeStart = null;

  function setRouteMode(on){
    routeMode = !!on;
    routeStart = null;
    const btn = document.getElementById('routeBtn');
    if(btn){
      btn.textContent = routeMode ? '🧭 Маршрут: выбери первого' : '🧭 Маршрут родства';
      btn.style.background = routeMode ? '#0a4a6b' : '#111a23';
      btn.style.borderColor = routeMode ? '#00e5ff' : '#2a3846';
      btn.style.color = routeMode ? '#00e5ff' : '#cfd8e0';
    }
    const tipEl = document.getElementById('routeTip');
    if(tipEl){
      tipEl.style.display = routeMode ? 'block' : 'none';
      tipEl.textContent = routeMode
        ? (routeStart ? 'Кликни по второму шару' : 'Кликни по первому шару')
        : '';
    }
    if(!routeMode) deselect();
  }

  function routeClick(id){
    if(!routeMode) return false;
    if(routeStart==null){
      routeStart = id;
      const btn = document.getElementById('routeBtn');
      if(btn) btn.textContent = '🧭 Маршрут: выбери второго';
      const tipEl = document.getElementById('routeTip');
      if(tipEl) tipEl.textContent = 'Кликни по второму шару';
      highlightRoute([id]);
      return true;
    } else {
      const startId = routeStart;
      const endId = id;
      routeStart = null;
      const btn = document.getElementById('routeBtn');
      if(btn) btn.textContent = '🧭 Маршрут: выбери первого';
      const tipEl = document.getElementById('routeTip');
      if(tipEl) tipEl.textContent = 'Кликни по первому шару';

      const path = findPath(startId, endId);
      if(!path){
        toast('Путь между этими людьми не найден');
        deselect();
        return true;
      }
      highlightRoute(path);
      showRouteCard(path);
      return true;
    }
  }

  function showRouteCard(pathIds){
    function personRow(pid, idx){
      const p = M.get(pid);
      const name = p?nm(p):('ID '+pid);
      const stepHtml = idx===0
        ? '<span style="color:#ff00ff;font-weight:bold">старт</span>'
        : (idx===pathIds.length-1
            ? '<span style="color:#ff00ff;font-weight:bold">финиш</span>'
            : '<span style="color:#00e5ff">шаг '+idx+'</span>');
      const rel = idx>0 ? describeStep(pathIds[idx-1], pid) : '';
      const relHtml = rel ? '<span style="color:#8a95a3;font-size:10px"> '+rel+'</span>' : '';
      return '<div class="route-row" data-id="'+pid+'">'+
             '<span class="route-step">'+stepHtml+'</span> '+
             '<span class="route-name">'+name+'</span>'+
             ' <span style="color:#5d6b78">('+pid+')</span>'+
             relHtml+
             '</div>';
    }
    const chainHtml = pathIds.map((pid,i)=>personRow(pid,i)).join('');

    const startP = M.get(pathIds[0]);
    const endP = M.get(pathIds[pathIds.length-1]);
    const relKind = (()=>{
      const n = pathIds.length;
      if(n===1) return 'это один и тот же человек';
      if(n===2){
        const a=M.get(pathIds[0]), b=M.get(pathIds[1]);
        if(b.father===a.ID) return 'отец → ребёнок';
        if(b.mother===a.ID) return 'мать → ребёнок';
        if(a.father===b.ID) return 'ребёнок → отец';
        if(a.mother===b.ID) return 'ребёнок → мать';
        const kidsA=new Set(CH.get(a.ID)||[]);
        const kidsB=new Set(CH.get(b.ID)||[]);
        let shared=false;kidsA.forEach(k=>{if(kidsB.has(k))shared=true});
        if(shared) return 'супруги';
        return 'прямая связь';
      }
      let up=0,down=0,spouse=0;
      for(let i=0;i<pathIds.length-1;i++){
        const a=M.get(pathIds[i]), b=M.get(pathIds[i+1]);
        if(b.father===a.ID||b.mother===a.ID) up++;
        else if(a.father===b.ID||a.mother===b.ID) down++;
        else spouse++;
      }
      const parts=[];
      if(up)     parts.push(up+' вверх по роду');
      if(down)   parts.push(down+' вниз');
      if(spouse) parts.push(spouse+' через брак');
      return parts.join(', ');
    })();

    const b=document.getElementById('info');
    b.innerHTML =
      '<h2 style="color:#00e5ff">🧭 Маршрут родства</h2>'+
      '<div style="font-size:12px;color:#b9c4cf;padding:4px 0 8px">'+
        '<b style="color:#8e9aa6">Между:</b> '+
        (startP?nm(startP):'?')+' <span style="color:#5d6b78">('+pathIds[0]+')</span>'+
        ' <span style="color:#00e5ff">⇢</span> '+
        (endP?nm(endP):'?')+' <span style="color:#5d6b78">('+pathIds[pathIds.length-1]+')</span>'+
      '</div>'+
      '<div style="font-size:11px;color:#7d8a97;padding-bottom:4px">Цепочка ('+(pathIds.length)+'): '+relKind+'</div>'+
      '<div class="route-list">'+chainHtml+'</div>'+
      '<br><button id="closeInfo">Закрыть</button>';

    b.style.display='block';
    document.getElementById('closeInfo').onclick=()=>{
      deselect();
    };
    b.querySelectorAll('.route-row').forEach(el=>{
      el.onclick=()=>{
        const id2=parseInt(el.dataset.id,10);
        const pos=positions.get(id2);
        if(pos){
          controls.target.copy(pos);
          camera.position.set(pos.x+200,pos.y+180,pos.z+300);
          controls.update();
        }
      };
    });
  }

  function deselect(){
    clearHighlight();
    document.getElementById('info').style.display='none';
  }

  // ---------- КАРТОЧКА ЧЕЛОВЕКА ----------
  function select(id){
    highlightSubtree(id);
    const p=M.get(id);if(!p)return;

    function statsFor(setIds){
      let males=0, females=0, unknown=0;
      setIds.forEach(mid=>{
        const q=M.get(mid);if(!q)return;
        if(q.Пол==='М')males++;
        else if(q.Пол==='Ж')females++;
        else unknown++;
      });
      return {males, females, unknown, total:males+females+unknown};
    }

    const ancSet     = ancestors(id);
    const descSet    = descendants(id);
    const inLawSet   = inLawCloud(id);
    const lawAncSet  = inLawAncestors(id);

    const ancStats    = statsFor(ancSet);
    const descStats   = statsFor(descSet);
    const inLawStats  = statsFor(inLawSet);
    const lawAncStats = statsFor(lawAncSet);

    const allSet = new Set([id, ...ancSet, ...descSet, ...inLawSet, ...lawAncSet]);
    const allStats = statsFor(allSet);

    const parn=x=>x&&M.has(x)?nm(M.get(x)):'';
    const allRows=[
      ['ID',p.ID],
      ['ФИО',nm(p)],
      ['Пол',p.Пол||''],
      ['Род / ветка',p["Род / Ветка"]||''],
      ['Отец',parn(p.father)],
      ['Мать',parn(p.mother)],
      ['Рождение',(p["Дата рождения"]||'').toString().slice(0,10)],
      ['Место',p["Место рождения"]||''],
      ['Смерть',(p["Дата смерти"]||'').toString().slice(0,10)],
      ['Y-DNA',p["Y-DNA (Гаплогруппа)"]||''],
      ['mtDNA',p.mtDNA||'']
    ];
    const rows=allRows.filter(r=>r[1]!==undefined&&r[1]!==null&&String(r[1]).trim()!=='');

    function statLine(label, s){
      const parts=[];
      if(s.males)  parts.push('<span style="color:#7fd4ff">♂ '+s.males+'</span>');
      if(s.females)parts.push('<span style="color:#ff9ecb">♀ '+s.females+'</span>');
      if(s.unknown)parts.push('<span style="color:#b8b0a5">? '+s.unknown+'</span>');
      return '<div class="stat-line"><span class="stat-label">'+label+'</span>'+
             '<span class="stat-value">'+parts.join(' · ')+
             ' <span class="stat-total">(всего '+s.total+')</span></span></div>';
    }

    const statsHtml =
      '<div class="stats-block">'+
        '<div class="stats-title">Статистика облака</div>'+
        statLine('Облако', allStats)+
        (ancStats.total    ? statLine('Предки', ancStats)          : '')+
        (descStats.total   ? statLine('Потомки', descStats)        : '')+
        (inLawStats.total  ? statLine('Свойственники', inLawStats) : '')+
        (lawAncStats.total ? statLine('Предки свойственников', lawAncStats) : '')+
      '</div>';

    function listBlock(title,arr){
      if(!arr.length)return '';
      return '<div style="margin-top:8px;font-size:11px;color:#7d8a97">'+title+' ('+arr.length+'):</div><div class="tree-list">'+
        arr.map(d=>'<div data-id="'+d.ID+'">• '+nm(d)+' <span style="color:#5d6b78">('+d.ID+')</span></div>').join('')+
        '</div>';
    }
    const ancList     = [...ancSet].map(i=>M.get(i)).filter(Boolean);
    const descList    = [...descSet].map(i=>M.get(i)).filter(Boolean);
    const inLawList   = [...inLawSet].map(i=>M.get(i)).filter(Boolean);
    const lawAncList  = [...lawAncSet].map(i=>M.get(i)).filter(Boolean);

    const treeHtml =
      listBlock('Предки', ancList)+
      listBlock('Потомки', descList)+
      listBlock('Свойственники', inLawList)+
      listBlock('Предки свойственника', lawAncList);

    const b=document.getElementById('info');
    b.innerHTML =
      '<h2>'+nm(p)+'</h2>'+
      rows.map(r=>'<div class="row"><b>'+r[0]+'</b>'+r[1]+'</div>').join('')+
      statsHtml+
      treeHtml+
      '<br><button id="closeInfo">Закрыть</button>';
    b.style.display='block';

    document.getElementById('closeInfo').onclick=deselect;
    b.querySelectorAll('.tree-list div').forEach(el=>{
      el.onclick=()=>{
        const id2=parseInt(el.dataset.id,10);
        select(id2);
        const pos=positions.get(id2);
        if(pos){
          controls.target.copy(pos);
          camera.position.set(pos.x+200,pos.y+180,pos.z+300);
          controls.update();
        }
      };
    });
  }

  // ---------- КНОПКИ / UI ----------
  function fit(){
    if(!positions.size)return;
    const box=new THREE.Box3();
    positions.forEach(v=>box.expandByPoint(v));
    const c=box.getCenter(new THREE.Vector3());
    const size=box.getSize(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z,200);
    const dist=maxDim*1.7;
    controls.target.copy(c);
    camera.position.set(c.x+dist*0.35,c.y+dist*0.35,c.z+dist*0.85);
    controls.update();
    syncZoomUI();
  }
  document.getElementById('fit').onclick=fit;
  document.getElementById('reset').onclick=()=>{controls.target.set(0,0,0);camera.position.set(0,700,1600);controls.update();syncZoomUI()};
  document.getElementById('top').onclick=()=>{controls.target.set(0,0,0);camera.position.set(0,2400,1);controls.update();syncZoomUI()};
  document.getElementById('save').onclick=()=>{
    const dump={};positions.forEach((v,k)=>{dump[k]={x:v.x,y:v.y,z:v.z}});
    try{localStorage.setItem(KEY_POS,JSON.stringify(dump));toast('Позиции сохранены ✓')}catch(e){toast('Ошибка: '+e)}
  };
  document.getElementById('clear').onclick=()=>{
    if(!confirm('Сбросить ручные позиции?'))return;
    try{localStorage.removeItem(KEY_POS)}catch(_){}
    savedPositions={};
    computeLayout();buildScene();fit();
    toast('Позиции сброшены');
  };
  document.getElementById('search').oninput=function(){
    const q=this.value.toLowerCase().trim();if(!q)return;
    const p=P.find(x=>nm(x).toLowerCase().includes(q)||String(x.ID)===q);
    if(p){
      select(p.ID);
      const pos=positions.get(p.ID);
      if(pos){controls.target.copy(pos);camera.position.set(pos.x+250,pos.y+200,pos.z+350);controls.update();syncZoomUI()}
    }
  };
  document.getElementById('routeBtn').onclick=()=>{
    setRouteMode(!routeMode);
  };

  // ---------- ПОЛЗУНОК МАСШТАБА ----------
  const zoomRange=document.getElementById('zoomRange');
  const zoomVal=document.getElementById('zoomVal');
  let baseDistance=1600;

  function applyZoomPercent(pct){
    const dist=baseDistance*(100/Math.max(10,pct));
    const dir=camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).add(dir.multiplyScalar(dist));
    controls.update();
  }
  function syncZoomUI(){
    const d=camera.position.distanceTo(controls.target);
    const pct=Math.round(100*(baseDistance/Math.max(50,d)));
    const clamped=Math.max(10,Math.min(300,pct));
    zoomRange.value=clamped;
    zoomVal.textContent=clamped+'%';
  }
  zoomRange.addEventListener('input',()=>{
    const v=parseInt(zoomRange.value,10);
    zoomVal.textContent=v+'%';
    applyZoomPercent(v);
  });
  dom.addEventListener('wheel',()=>{setTimeout(syncZoomUI,50)});

  // ---------- ИМПОРТ XLSX ----------
  document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
  document.getElementById('fileInput').addEventListener('change',async function(){
    const file=this.files&&this.files[0];
    if(!file)return;
    if(typeof XLSX==='undefined'){toast('SheetJS не загрузился');return}
    try{
      toast('Читаю файл…',1500);
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array',cellDates:true});
      const sheetName=wb.SheetNames[0];
      const sheet=wb.Sheets[sheetName];
      const rows=XLSX.utils.sheet_to_json(sheet,{defval:"",raw:false});
      const mapped=rows.map(r=>{
        const o={};
        Object.keys(r).forEach(k=>{
          let key=String(k).trim();
          if(key==='Род/Ветка')key='Род / Ветка';
          o[key]=r[k]==null?'':String(r[k]).trim();
        });
        return o;
      }).filter(o=>String(o.ID||'').trim()!=='');
      if(!mapped.length)throw new Error('Нет строк с колонкой ID');
      mapped.forEach(o=>{
        ['Дата рождения','Дата смерти'].forEach(k=>{
          if(o[k]&&o[k].length>10)o[k]=o[k].slice(0,10);
        });
      });
      localStorage.setItem(KEY_DATA,JSON.stringify(mapped));
      applyData(mapped);
      toast('Импортировано: '+mapped.length+' человек из «'+sheetName+'»');
    }catch(err){
      console.error(err);
      toast('Ошибка импорта: '+(err.message||err),4000);
      const el=document.getElementById('err');el.style.display='block';
      el.textContent='Ошибка импорта XLSX:\n'+(err.stack||err)+'\n';
    }
  });

  document.getElementById('resetData').onclick=()=>{
    if(!confirm('Вернуть встроенные данные?'))return;
    try{localStorage.removeItem(KEY_DATA)}catch(_){}
    applyData(BUILTIN_P);
    toast('Восстановлены встроенные данные');
  };

  function applyData(arr){
    buildGraph(arr);
    computeLayout();
    buildScene();
    setTimeout(()=>{fit();syncZoomUI()},60);
  }

  // ---------- resize ----------
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  // ---------- рендер ----------
  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
  }

  let initial=BUILTIN_P;
  try{
    const stored=localStorage.getItem(KEY_DATA);
    if(stored){const a=JSON.parse(stored);if(Array.isArray(a)&&a.length)initial=a}
  }catch(_){}
  applyData(initial);
  animate();

}catch(err){
  const el=document.getElementById('err');
  el.style.display='block';
  el.textContent='Ошибка инициализации:\n'+(err&&err.stack?err.stack:err);
  console.error(err);
}
})();
</script>
</body></html>
