<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Родословная 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#292621;background:#05080b}
#ui{position:fixed;z-index:10;left:14px;right:14px;top:12px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
.panel{pointer-events:auto;background:#0d141bee;border:1px solid #1e2a35;border-radius:12px;padding:8px 10px;box-shadow:0 3px 16px #0009;color:#cfd8e0}
.title{font-weight:750;font-size:15px;color:#e8eef5}.sub,.stats{font-size:11px;color:#7d8a97}
input,button,select{font:inherit;color:#cfd8e0}
input[type=text]{width:180px;padding:8px;border:1px solid #2a3846;border-radius:8px;background:#0a1016}
input[type=range]{width:150px;vertical-align:middle}
select{padding:8px;border:1px solid #2a3846;border-radius:8px;background:#0a1016;max-width:240px}
button{padding:8px 10px;border:1px solid #2a3846;border-radius:8px;background:#111a23;cursor:pointer}
button:hover{background:#1a2733;border-color:#3a4d5e}#stats{margin-left:auto}
#info{position:fixed;z-index:12;right:14px;top:72px;width:340px;max-height:calc(100vh - 88px);overflow:auto;display:none}
#info h2{margin:0 0 6px;font-size:17px;color:#e8eef5}
.row{font-size:12px;padding:5px 0;border-bottom:1px solid #1e2a35;color:#b9c4cf}
.row b{display:inline-block;width:92px;color:#7d8a97}
.stats-block{margin-top:10px;padding-top:8px;border-top:1px solid #1e2a35;font-size:12px}
.stats-title{font-size:11px;color:#7d8a97;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px}
.stat-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0}
.stat-label{color:#8e9aa6}.stat-value{text-align:right}.stat-total{color:#5d6b78;font-size:10px;margin-left:4px}
.tree-list{font-size:11px;color:#9fb0bf;margin-top:6px;padding-left:6px}
.tree-list div{padding:4px 0;border-bottom:1px dotted #1e2a35;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.tree-list div:hover{color:#7fd4ff}
.tree-list .rel-label{font-size:10px;color:#8a95a3;font-style:italic}
#suggestBox{position:fixed;z-index:30;background:#0d141bee;border:1px solid #1e2a35;border-radius:8px;box-shadow:0 8px 24px #0009;max-height:320px;overflow:auto;display:none;font-size:12px;color:#cfd8e0;min-width:240px}
#suggestBox .sug-item{padding:8px 12px;border-bottom:1px solid #1e2a35;cursor:pointer}
#suggestBox .sug-item:last-child{border-bottom:none}
#tip{position:fixed;left:14px;bottom:13px;z-index:5;font-size:11px;color:#9fb0bf;background:#0b1116dd;border:1px solid #1e2a35;border-radius:8px;padding:7px 10px;max-width:60vw}
#routeTip{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:15;background:#0d141bee;border:1px solid #00e5ff;color:#00e5ff;padding:8px 16px;border-radius:10px;display:none;font-size:13px}
#err{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#7a1e1e;color:#fff;padding:10px;font:12px monospace;display:none;max-height:40vh;overflow:auto;white-space:pre-wrap}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:20;background:#0d141bee;border:1px solid #1e2a35;color:#cfd8e0;padding:10px 16px;border-radius:10px;display:none;font-size:13px}
#loading{position:fixed;inset:0;z-index:80;background:#02060acc;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#loading .spinner{width:44px;height:44px;border:4px solid #1e2a35;border-top-color:#00e5ff;border-radius:50%;animation:spin 1s linear infinite}
#loading .msg{color:#cfd8e0;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.zoomwrap{display:flex;align-items:center;gap:6px;font-size:11px;color:#7d8a97}
#ctrlBody{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#togglePanel{display:none;width:100%;margin-bottom:6px;font-weight:bold}
#infoHeader{display:none;padding:6px 0 8px;border-bottom:1px solid #1e2a35;margin-bottom:6px;cursor:pointer}
#infoHeader .toggle{color:#7fd4ff;font-size:11px}
#treeView{position:fixed;inset:0;z-index:20;display:none;touch-action:none}
#treeView svg{display:block;width:100%;height:100%;background:rgba(2,6,10,0.85)}
#treeBar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:22;background:#0d141bee;border:1px solid #1e2a35;border-radius:12px;padding:8px 12px;color:#cfd8e0;display:none;gap:8px;align-items:center;flex-wrap:wrap;max-width:95vw}
#treeBar .ttl{font-weight:650;color:#e8eef5;font-size:13px}
#treeBar .hint{font-size:11px;color:#7d8a97}
.root-menu{position:fixed;inset:0;z-index:25;background:#02060acc;display:none;align-items:center;justify-content:center;padding:20px}
.root-menu-inner{background:#0d141b;border:1px solid #1e2a35;border-radius:14px;padding:20px;max-width:600px;width:100%;max-height:80vh;overflow:auto;color:#cfd8e0}
.root-menu-inner h2{margin:0 0 12px;font-size:18px;color:#e8eef5}
.root-item{padding:10px 12px;border:1px solid #1e2a35;border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.root-item:hover{background:#141c26;border-color:#00e5ff}
.root-item .ri-name{font-weight:650;color:#e8eef5;font-size:14px}
.root-item .ri-path{font-size:11px;color:#7d8a97;margin-top:3px}
.root-item .ri-count{color:#7fd4ff;font-size:11px;margin-top:3px}
.root-menu-inner .close-btn{margin-top:10px;padding:8px 16px;width:100%}
.pdf-menu{position:fixed;inset:0;z-index:26;background:#02060acc;display:none;align-items:center;justify-content:center;padding:20px}
.pdf-menu-inner{background:#0d141b;border:1px solid #1e2a35;border-radius:14px;padding:20px;max-width:420px;width:100%;color:#cfd8e0}
.pdf-menu-inner h2{margin:0 0 12px;font-size:17px;color:#e8eef5}
.pdf-menu-inner label{display:block;padding:10px;border:1px solid #1e2a35;border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.pdf-menu-inner label:hover{background:#141c26;border-color:#00e5ff}
.pdf-menu-inner input{margin-right:8px}
.pdf-menu-inner .desc{font-size:11px;color:#7d8a97;margin-left:24px;display:block;margin-top:3px}
@media(max-width:800px){
  #ui{left:8px;right:8px;top:8px;gap:6px}
  #ui .panel:first-child{display:none}
  #ctrlPanel{width:100%;padding:6px 8px}
  #togglePanel{display:block !important}
  #ctrlBody{display:none}
  #ctrlBody.open{display:flex !important}
  #ctrlBody button,#ctrlBody select,#ctrlBody input[type=text]{flex:1 1 auto;min-width:120px;font-size:13px;padding:6px 8px}
  .zoomwrap{flex:1 1 100%;justify-content:center}
  #info{left:8px;right:8px;top:auto;bottom:12px;width:auto;max-height:45vh;padding:6px 10px}
  #info.collapsed{max-height:60px;overflow:hidden}
  #infoHeader{display:block}
  #tip{display:none}
  #stats{font-size:10px;padding:6px 8px;margin-left:0}
  #routeTip{top:auto;bottom:80px;font-size:12px;padding:6px 12px}
  #treeBar{top:auto;bottom:8px;left:8px;right:8px;transform:none;font-size:12px;padding:6px 10px}
}
</style></head><body>
<div id="ui">
 <div class="panel"><div class="title">Родословная 3D</div><div class="sub">клик = облако родства · 🧭 = маршрут · 🌳 = древо от предка</div></div>
 <div class="panel" id="ctrlPanel">
   <button id="togglePanel">☰ Меню</button>
   <div id="ctrlBody">
     <input id="search" type="text" placeholder="Найти человека…" autocomplete="off">
     <select id="branchFilter"></select>
     <button id="importBtn" style="display:none">📥 Импорт XLSX</button>
     <input id="fileInput" type="file" accept=".xlsx,.xls" style="display:none">
     <button id="routeBtn">🧭 Маршрут родства</button>
     <button id="pngBtn">📷 Экспорт PNG</button>
     <button id="resetData">Сброс к встроенным</button>
     <button id="fit">Вписать</button>
     <button id="reset">Сброс вида</button>
     <button id="top">Сверху</button>
     <button id="save">Сохранить позиции</button>
     <button id="clear">Сброс позиций</button>
     <span class="zoomwrap">Масштаб <input id="zoomRange" type="range" min="10" max="300" value="100"><span id="zoomVal">100%</span></span>
   </div>
 </div>
 <div id="stats" class="panel stats">—</div>
</div>
<div id="routeTip"></div>
<div id="suggestBox"></div>
<div id="info" class="panel"></div>
<div id="tip">🖱 ЛКМ — вращение · по шару — тянуть · колесо — зум · ПКМ — сдвиг · 🌳 — древо от предка</div>
<div id="toast"></div>
<div id="loading"><div class="spinner"></div><div class="msg" id="loadingMsg">Загрузка…</div></div>

<div id="treeView">
  <svg id="treeSvg" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<div id="treeBar">
  <span class="ttl" id="treeTitle">🌳 Древо</span>
  <span class="hint">колесо — зум · перетаскивание — панорама · клик — карточка</span>
  <button id="treePng">📄 Экспорт PDF</button>
  <button id="treeBack">◀ Назад</button>
</div>

<div id="rootMenu" class="root-menu">
  <div class="root-menu-inner">
    <h2>Выберите древо от предка</h2>
    <div id="rootMenuList"></div>
    <button class="close-btn" id="rootMenuClose">Отмена</button>
  </div>
</div>
<div id="pdfMenu" class="pdf-menu">
  <div class="pdf-menu-inner">
    <h2>Экспорт PDF</h2>
    <label><input type="radio" name="pdfFormat" value="a4" checked> A4
      <span class="desc">Стандартный лист</span></label>
    <label><input type="radio" name="pdfFormat" value="a3"> A3
      <span class="desc">Увеличенный лист</span></label>
    <label><input type="radio" name="pdfFormat" value="big"> Большой лист
      <span class="desc">Для больших деревьев</span></label>
    <button id="pdfMake" style="margin-top:8px;padding:10px;width:100%;background:#0a4a6b;border-color:#00e5ff;color:#00e5ff;font-weight:bold">Создать PDF</button>
    <button id="pdfCancel" style="margin-top:6px;padding:8px;width:100%">Отмена</button>
  </div>
</div>

<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
window.addEventListener('error',e=>{
  const el=document.getElementById('err');el.style.display='block';
  el.textContent+='[ERR] '+(e.message||e.error)+' @ '+(e.filename||'')+':'+(e.lineno||'')+'\n';
});
function toast(msg,ms){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms||2500);
}
function showLoading(msg){
  const l=document.getElementById('loading');
  document.getElementById('loadingMsg').textContent=msg||'Загрузка…';
  l.style.display='flex';
}
function hideLoading(){document.getElementById('loading').style.display='none'}
</script>

<script>
(function(){
try{
  if(typeof THREE==='undefined')throw new Error('Three.js не загрузился');
  if(!THREE.OrbitControls)throw new Error('OrbitControls не загрузился');

  const isLocalFile = location.protocol==='file:';
  const urlParams = new URLSearchParams(location.search);
  const isAdmin = isLocalFile || urlParams.get('admin')==='1';
  if(isAdmin){const b=document.getElementById('importBtn');if(b)b.style.display=''}

  let P=[],M=new Map(),CH=new Map(),L=new Map();
  let maxLevel=0;
  let positions=new Map(),spheres=new Map(),labels=new Map(),edgeDefs=[],lineObjects=[];
  let currentData=[],activeBranch='__ALL__';
  let isMobile=window.innerWidth<=800;

  const KEY_DATA='rod_data_v1';
  const KEY_POS='rod_3d_positions_v12';
  let savedPositions={};
  try{savedPositions=JSON.parse(localStorage.getItem(KEY_POS)||'{}')}catch(e){}

  const nm=p=>[p.Фамилия,p.Имя,p.Отчество].filter(Boolean).join(' ')||('ID '+p.ID);
  const par=p=>[p.father,p.mother].filter(x=>x!=null&&M.has(x));

  function buildGraph(arr){
    P=arr.map(p=>({...p,
      ID:parseInt(p.ID,10),
      father:p['ID Отца']?parseInt(p['ID Отца'],10):null,
      mother:p['ID Матери']?parseInt(p['ID Матери'],10):null
    })).filter(p=>!isNaN(p.ID));
    M=new Map();P.forEach(p=>M.set(p.ID,p));
    CH=new Map();
    P.forEach(p=>{
      [p.father,p.mother].forEach(x=>{
        if(x!=null&&M.has(x)){
          if(!CH.has(x))CH.set(x,[]);
          CH.get(x).push(p.ID);
        }
      });
    });
    L=new Map();
    P.filter(p=>!par(p).length).forEach(p=>L.set(p.ID,0));
    for(let k=0;k<P.length;k++){
      let z=0;
      P.forEach(p=>{
        const a=par(p).filter(x=>L.has(x));
        if(a.length){
          const v=Math.max(...a.map(x=>L.get(x)))+1;
          if(!L.has(p.ID)||v>L.get(p.ID)){L.set(p.ID,v);z=1}
        }
      });
      if(!z)break;
    }
    P.forEach(p=>{if(!L.has(p.ID))L.set(p.ID,0)});
    maxLevel=Math.max(...[...L.values()],0);
  }

  // ---------- 3D ----------
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x02060a);
  scene.fog=new THREE.FogExp2(0x02060a,0.00022);
  const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,30000);
  camera.position.set(0,700,1600);
  const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  document.body.appendChild(renderer.domElement);
  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=0.08;
  controls.maxDistance=20000;controls.minDistance=60;
  scene.add(new THREE.AmbientLight(0xffffff,0.8));
  const dl=new THREE.DirectionalLight(0xffffff,0.6);dl.position.set(600,1200,800);scene.add(dl);
  const dl2=new THREE.DirectionalLight(0x86b7ff,0.35);dl2.position.set(-600,600,-800);scene.add(dl2);
  const sphereGeo=new THREE.SphereGeometry(1,20,16);
  const haloCanvas=document.createElement('canvas');
  haloCanvas.width=128;haloCanvas.height=128;
  {
    const g=haloCanvas.getContext('2d');
    const grad=g.createRadialGradient(64,64,2,64,64,62);
    grad.addColorStop(0,'rgba(255,255,255,0.9)');
    grad.addColorStop(0.4,'rgba(255,255,255,0.25)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=grad;g.fillRect(0,0,128,128);
  }
  const haloTex=new THREE.CanvasTexture(haloCanvas);haloTex.minFilter=THREE.LinearFilter;
  let spheresGroup=new THREE.Group(),labelsGroup=new THREE.Group(),edgesGroup=new THREE.Group(),starsGroup=new THREE.Group();
  scene.add(spheresGroup);scene.add(labelsGroup);scene.add(edgesGroup);scene.add(starsGroup);

  function buildStars(){
    while(starsGroup.children.length){
      const c=starsGroup.children.pop();
      if(c.geometry&&c.geometry!==sphereGeo)c.geometry.dispose();
      if(c.material)c.material.dispose();starsGroup.remove(c);
    }
    const N=900;
    for(let i=0;i<N;i++){
      const r=400+Math.random()*4200;
      const theta=Math.random()*Math.PI*2;
      const phi=Math.acos(2*Math.random()-1);
      const x=r*Math.sin(phi)*Math.cos(theta);
      const y=r*Math.cos(phi)*0.7;
      const z=r*Math.sin(phi)*Math.sin(theta);
      const size=0.8+Math.random()*2.2;
      const c=new THREE.Color().setHSL(0.62,0.05,0.55+Math.random()*0.35);
      const mat=new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.5+Math.random()*0.5});
      const m=new THREE.Mesh(sphereGeo,mat);
      m.scale.set(size,size,size);m.position.set(x,y,z);starsGroup.add(m);
    }
  }
  buildStars();

  function sphereColor(p){
    const lv=L.get(p.ID)||0;
    const t=maxLevel?lv/maxLevel:0;
    const c=new THREE.Color();
    if(p.Пол==='М')c.setHSL(0.58-t*0.08,0.75,0.58-t*0.08);
    else if(p.Пол==='Ж')c.setHSL(0.92-t*0.06,0.75,0.60-t*0.08);
    else c.setHSL(0.10,0.30,0.60-t*0.05);
    return c;
  }
  function radiusOf(p){
    const kids=(CH.get(p.ID)||[]).length;
    let base=12+Math.min(kids,6)*1.6;
    const lv=L.get(p.ID)||0;
    base-=lv*0.4;
    return Math.max(7,base);
  }

  function computeLayout(){
    positions=new Map();
    const RX=1300,RY=900,RZ=900,CORE_R=0.15;
    const totalLevels=maxLevel+1;
    const byLevel=new Map();
    P.forEach(p=>{const lv=L.get(p.ID)||0;if(!byLevel.has(lv))byLevel.set(lv,[]);byLevel.get(lv).push(p)});
    function radiusFactor(lv){if(totalLevels<=1)return 1;const t=lv/(totalLevels-1);return CORE_R+(1-CORE_R)*t}
    const placedPos=new Map();
    const levelsSorted=[...byLevel.keys()].sort((a,b)=>a-b);
    levelsSorted.forEach(lv=>{
      const arr=byLevel.get(lv).slice();
      arr.forEach(p=>{
        const parents=[p.father,p.mother].filter(x=>x!=null&&placedPos.has(x));
        if(parents.length){
          let sx=0,sy=0,sz=0;
          parents.forEach(pid=>{const v=placedPos.get(pid);sx+=v.x;sy+=v.y;sz+=v.z});
          const v=new THREE.Vector3(sx,sy,sz).normalize();
          p._dirX=v.x;p._dirY=v.y;p._dirZ=v.z;p._hasDir=true;
        } else {p._hasDir=false}
      });
      const N=arr.length;
      const RING_CAP=Math.max(20,Math.ceil(N/3));
      arr.sort((a,b)=>{
        if(!a._hasDir&&!b._hasDir)return a.ID-b.ID;
        if(!a._hasDir)return 1;if(!b._hasDir)return -1;
        const fa=Math.atan2(a._dirZ,a._dirX),fb=Math.atan2(b._dirZ,b._dirX);
        if(Math.abs(fa-fb)>0.01)return fa-fb;
        return a._dirY-b._dirY;
      });
      const rings=[];
      for(let i=0;i<N;i+=RING_CAP)rings.push(arr.slice(i,i+RING_CAP));
      rings.forEach((ring,ri)=>{
        const baseFactor=radiusFactor(lv);
        const ringFactor=Math.min(1,baseFactor+(ri*0.06)/Math.max(1,totalLevels));
        const rx=RX*ringFactor,ry=RY*ringFactor,rz=RZ*ringFactor;
        const n=ring.length;
        ring.forEach((p,i)=>{
          const phi=(i/Math.max(1,n))*Math.PI*2+lv*0.7+ri*1.3;
          const t=((i*2654435761)>>>0)/4294967296;
          const theta=(t-0.5)*1.2;
          let px=rx*Math.cos(theta)*Math.cos(phi);
          let py=ry*Math.sin(theta);
          let pz=rz*Math.cos(theta)*Math.sin(phi);
          if(p._hasDir){
            const pull=0.35;
            px=px*(1-pull)+(p._dirX*RX*ringFactor)*pull;
            py=py*(1-pull)+(p._dirY*RY*ringFactor)*pull;
            pz=pz*(1-pull)+(p._dirZ*RZ*ringFactor)*pull;
          }
          const jx=(Math.random()-0.5)*60,jy=(Math.random()-0.5)*60,jz=(Math.random()-0.5)*60;
          const v=new THREE.Vector3(px+jx,py+jy,pz+jz);
          positions.set(p.ID,v);placedPos.set(p.ID,v);
        });
      });
    });
    P.forEach(p=>{if(!positions.has(p.ID))positions.set(p.ID,new THREE.Vector3((Math.random()-0.5)*RX,(Math.random()-0.5)*RY,(Math.random()-0.5)*RZ))});
    P.forEach(p=>{const s=savedPositions[p.ID];if(s&&typeof s.x==='number')positions.set(p.ID,new THREE.Vector3(s.x,s.y,s.z))});
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity,minZ=Infinity,maxZ=-Infinity;
    positions.forEach(v=>{minX=Math.min(minX,v.x);maxX=Math.max(maxX,v.x);minY=Math.min(minY,v.y);maxY=Math.max(maxY,v.y);minZ=Math.min(minZ,v.z);maxZ=Math.max(maxZ,v.z)});
    const cx=(minX+maxX)/2,cy=(minY+maxY)/2,cz=(minZ+maxZ)/2;
    positions.forEach(v=>{v.x-=cx;v.y-=cy;v.z-=cz});
  }

  function buildScene(){
    [spheresGroup,labelsGroup,edgesGroup].forEach(g=>{
      while(g.children.length){
        const c=g.children.pop();
        if(c.geometry&&c.geometry!==sphereGeo)c.geometry.dispose();
        if(c.material&&c.material.map&&c.material.map!==haloTex)c.material.map.dispose();
        if(c.material)c.material.dispose();g.remove(c);
      }
    });
    spheres=new Map();labels=new Map();lineObjects=[];
    P.forEach(p=>{
      const pos=positions.get(p.ID);if(!pos)return;
      const r=radiusOf(p);
      const col=sphereColor(p);
      const mat=new THREE.MeshPhongMaterial({color:col,emissive:col.clone().multiplyScalar(0.35),shininess:40,transparent:false});
      const m=new THREE.Mesh(sphereGeo,mat);
      m.scale.set(r,r,r);m.position.copy(pos);
      m.userData.id=p.ID;m.userData.baseScale=r;m.userData.baseColor=col.clone();
      spheresGroup.add(m);spheres.set(p.ID,m);
      const cvs=document.createElement('canvas');cvs.width=512;cvs.height=64;
      const ctx=cvs.getContext('2d');
      ctx.font='bold 26px -apple-system,Segoe UI,Arial';ctx.fillStyle='#ffffff';ctx.textBaseline='middle';
      const full=nm(p);ctx.fillText(full.length>28?full.slice(0,27)+'…':full,8,32);
      const tex=new THREE.CanvasTexture(cvs);tex.minFilter=THREE.LinearFilter;
      const smat=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false,opacity:0.85});
      const spr=new THREE.Sprite(smat);spr.scale.set(110,14,1);
      spr.position.copy(pos.clone().add(new THREE.Vector3(0,r+18,0)));
      spr.userData.id=p.ID;labelsGroup.add(spr);labels.set(p.ID,spr);
      const hmat=new THREE.SpriteMaterial({map:haloTex,color:col.clone().multiplyScalar(1.4),transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false});
      const hs=new THREE.Sprite(hmat);hs.scale.set(r*6,r*6,1);hs.position.copy(pos);hs.userData.id=p.ID;
      p._halo=hs;spheresGroup.add(hs);
    });
    edgeDefs=[];
    P.forEach(c=>{par(c).forEach(pid=>edgeDefs.push({from:pid,to:c.ID,type:'parent'}))});
    const spouseSet=new Set();
    P.forEach(c=>{
      if(c.father&&c.mother){
        const k=Math.min(c.father,c.mother)+'_'+Math.max(c.father,c.mother);
        if(!spouseSet.has(k)){spouseSet.add(k);edgeDefs.push({from:c.father,to:c.mother,type:'spouse'})}
      }
    });
    rebuildEdges();
    document.getElementById('stats').textContent=P.length+' человек · '+(maxLevel+1)+' поколений · '+edgeDefs.length+' связей';
  }

  function createRiverEdge(a,b,type){
    const group=new THREE.Group();
    const col=new THREE.Color(type==='spouse'?0xff6ab0:0x59a9ff);
    const opacity=type==='spouse'?0.35:0.5;
    const dir=b.clone().sub(a);
    const len=dir.length();if(len<1)return group;
    const unit=dir.clone().normalize();
    const R=10;
    const aSurf=a.clone().add(unit.clone().multiplyScalar(R));
    const bSurf=b.clone().sub(unit.clone().multiplyScalar(R));
    const mid=aSurf.clone().add(bSurf).multiplyScalar(0.5);
    const perp=new THREE.Vector3(-unit.z,0,unit.x).normalize();
    const bend=Math.min(60,len*0.15);
    mid.add(perp.multiplyScalar(bend*(type==='spouse'?-1:1)));
    mid.y+=(bSurf.y-aSurf.y)*0.08;
    const curve=new THREE.CatmullRomCurve3([aSurf,mid,bSurf]);
    const pts=curve.getPoints(type==='spouse'?12:20);
    const geo=new THREE.BufferGeometry().setFromPoints(pts);
    const mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:opacity,blending:THREE.AdditiveBlending,depthWrite:false});
    const line=new THREE.Line(geo,mat);group.add(line);return group;
  }
  function rebuildEdges(){
    while(edgesGroup.children.length){
      const c=edgesGroup.children.pop();
      c.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()});
      edgesGroup.remove(c);
    }
    lineObjects=[];
    edgeDefs.forEach(def=>{
      const a=positions.get(def.from),b=positions.get(def.to);if(!a||!b)return;
      const g=createRiverEdge(a.clone(),b.clone(),def.type);
      g.userData={def};
      g.traverse(o=>{if(o.material){o.userData._baseColor=o.material.color.clone();o.userData._baseOpacity=o.material.opacity}});
      edgesGroup.add(g);lineObjects.push(g);
    });
  }

  // ---------- Родство ----------
  function descendants(id){const out=new Set(),q=[id];while(q.length){const x=q.pop();(CH.get(x)||[]).forEach(k=>{if(!out.has(k)){out.add(k);q.push(k)}})}return out}
  function ancestors(id){const out=new Set(),q=[id];while(q.length){const x=q.pop();const p=M.get(x);if(!p)continue;[p.father,p.mother].forEach(pp=>{if(pp!=null&&M.has(pp)&&!out.has(pp)){out.add(pp);q.push(pp)}})}return out}
  function bloodCloud(id){const s=new Set([id]);ancestors(id).forEach(a=>s.add(a));descendants(id).forEach(d=>s.add(d));return s}
  function inLawCloud(id){const cloud=bloodCloud(id);const inLaws=new Set();(CH.get(id)||[]).forEach(k=>{const kp=M.get(k);if(!kp)return;[kp.father,kp.mother].forEach(pp=>{if(pp!=null&&M.has(pp)&&!cloud.has(pp))inLaws.add(pp)})});return inLaws}
  function inLawAncestors(id){const inLaws=inLawCloud(id);const out=new Set();inLaws.forEach(lawId=>{ancestors(lawId).forEach(a=>{if(!out.has(a))out.add(a)})});const ownBlood=new Set([id,...ancestors(id),...descendants(id),...inLaws]);const filtered=new Set();out.forEach(a=>{if(!ownBlood.has(a))filtered.add(a)});return filtered}

  function relationLabel(centerId,otherId){
    const c=M.get(centerId),o=M.get(otherId);if(!c||!o)return '';
    if(centerId===otherId)return 'это он(а)';
    if(o.ID===c.father)return 'отец';if(o.ID===c.mother)return 'мать';
    const cKids=CH.get(c.ID)||[];
    if(cKids.includes(o.ID))return o.Пол==='М'?'сын':'дочь';
    const cKidsSet=new Set(cKids);let shared=false;(CH.get(o.ID)||[]).forEach(k=>{if(cKidsSet.has(k))shared=true});
    if(shared)return o.Пол==='М'?'муж':'жена';
    const anc=ancestors(centerId);
    if(anc.has(otherId)){
      let minUp=null;const q=[{id:centerId,d:0}],seen=new Set();
      while(q.length){const {id,d}=q.shift();if(seen.has(id))continue;seen.add(id);if(id===otherId){minUp=d;break}const p=M.get(id);if(!p)continue;[p.father,p.mother].forEach(x=>{if(x!=null&&M.has(x))q.push({id:x,d:d+1})})}
      if(minUp){const male=o.Пол==='М';if(minUp===2)return male?'дед':'бабушка';if(minUp===3)return male?'прадед':'прабабушка';if(minUp===4)return male?'прапрадед':'прапрабабушка';return male?'предок':'предок'}
    }
    const desc=descendants(centerId);
    if(desc.has(otherId)){
      let minDown=null;const q=[{id:centerId,d:0}],seen=new Set();
      while(q.length){const {id,d}=q.shift();if(seen.has(id))continue;seen.add(id);if(id===otherId){minDown=d;break}(CH.get(id)||[]).forEach(x=>q.push({id:x,d:d+1}))}
      if(minDown){const male=o.Пол==='М';if(minDown===2)return male?'внук':'внучка';if(minDown===3)return male?'правнук':'правнучка';if(minDown===4)return male?'праправнук':'праправнучка';return male?'потомок':'потомок'}
    }
    const cParents=[c.father,c.mother].filter(x=>x!=null);
    const oParents=[o.father,o.mother].filter(x=>x!=null);
    if(cParents.some(p=>oParents.includes(p)))return o.Пол==='М'?'брат':'сестра';

    const sibs=new Set();
    P.forEach(x=>{if(x.ID===c.ID)return;const xP=[x.father,x.mother].filter(y=>y!=null);if(xP.some(p=>cParents.includes(p)))sibs.add(x.ID)});

  // ---------- Маршрут ----------
  let routeMode=false,routeStart=null;
  function buildUndirectedGraph(){
    const adj=new Map();
    P.forEach(p=>{if(!adj.has(p.ID))adj.set(p.ID,new Set())});
    P.forEach(p=>{
      [p.father,p.mother].forEach(pid=>{if(pid!=null&&M.has(pid)){adj.get(p.ID).add(pid);adj.get(pid).add(p.ID)}});
      if(p.father&&p.mother&&M.has(p.father)&&M.has(p.mother)){adj.get(p.father).add(p.mother);adj.get(p.mother).add(p.father)}
    });
    return adj;
  }
  function findPath(s,e){
    if(s===e)return[s];
    const adj=buildUndirectedGraph();if(!adj.has(s)||!adj.has(e))return null;
    const prev=new Map();prev.set(s,null);const q=[s];
    while(q.length){const c=q.shift();if(c===e)break;const n=adj.get(c)||new Set();for(const x of n){if(!prev.has(x)){prev.set(x,c);q.push(x)}}}
    if(!prev.has(e))return null;
    const p=[];let x=e;while(x!=null){p.unshift(x);x=prev.get(x)}return p;
  }
  function describeStep(a,b){const A=M.get(a),B=M.get(b);if(!A||!B)return '';if(B.father===a||B.mother===a)return 'родитель →';if(A.father===b||A.mother===b)return '← ребёнок';const kA=new Set(CH.get(a)||[]);let sh=false;(CH.get(b)||[]).forEach(k=>{if(kA.has(k))sh=true});if(sh)return 'супруг(а)';return '—'}

  function getBloodDescendants(rootId){
    const out=new Set();
    const q=[rootId];
    while(q.length){
      const x=q.shift();
      if(out.has(x))continue;
      out.add(x);
      const kids=CH.get(x)||[];
      for(const k of kids){
        if(M.has(k)&&!out.has(k))q.push(k);
      }
    }
    return out;
  }
  function findBloodPath(rootId,targetId){
    const prev=new Map();
    prev.set(rootId,null);
    const q=[rootId];
    while(q.length){
      const c=q.shift();
      if(c===targetId)break;
      const kids=CH.get(c)||[];
      for(const k of kids){
        if(M.has(k)&&!prev.has(k)){prev.set(k,c);q.push(k)}
      }
    }
    if(!prev.has(targetId))return null;
    const path=[];let x=targetId;
    while(x!=null){path.unshift(x);x=prev.get(x)}
    return path;
  }
  function findAllRoots(id){
    const roots=new Set();
    const seen=new Set();
    const stack=[id];
    while(stack.length){
      const x=stack.pop();
      if(seen.has(x))continue;
      seen.add(x);
      const p=M.get(x);
      if(!p)continue;
      const hasF=p.father!=null&&M.has(p.father);
      const hasM=p.mother!=null&&M.has(p.mother);
      if(!hasF&&!hasM){roots.add(x)}
      else{
        if(hasF)stack.push(p.father);
        if(hasM)stack.push(p.mother);
      }
    }
    return [...roots];
  }

  // ---------- КРОВНОЕ ДРЕВО: компактная укладка без пересечений основного каркаса ----------
  // Для раскладки у каждого потомка выбирается один родитель-каркас.
  // Второй родитель (если он тоже входит в дерево) остаётся отдельной кровной связью.
  function layoutTree(rootId, include, NODE_W, NODE_H, GAP_X, GAP_Y){
    const depth = new Map([[rootId, 0]]);
    const primaryParent = new Map();
    const primaryChildren = new Map();
    const q = [rootId];

    // Строим остов от выбранного предка. Каждый человек попадает в каркас один раз.
    while(q.length){
      const parentId = q.shift();
      const kids = (CH.get(parentId) || []).filter(id => include.has(id) && M.has(id));
      kids.sort((a,b) => a-b);
      for(const childId of kids){
        if(depth.has(childId)) continue;
        depth.set(childId, depth.get(parentId) + 1);
        primaryParent.set(childId, parentId);
        if(!primaryChildren.has(parentId)) primaryChildren.set(parentId, []);
        primaryChildren.get(parentId).push(childId);
        q.push(childId);
      }
    }

    // Защитный проход для записей, которые по ошибке не попали в обход.
    let maxDepth = Math.max(0, ...depth.values());
    include.forEach(id => { if(!depth.has(id)) depth.set(id, ++maxDepth); });

    // Если оба родителя присутствуют в древе, ребёнок должен находиться ниже ОБОИХ.
    // Уточняем уровни по всем кровным связям, чтобы ни одна линия не шла вверх.
    for(let pass=0;pass<include.size;pass++){
      let changed=false;
      include.forEach(childId=>{
        const child=M.get(childId);if(!child)return;
        const parentIds=[child.father,child.mother].filter(pid=>pid!=null&&include.has(pid)&&depth.has(pid));
        if(!parentIds.length)return;
        const required=Math.max(...parentIds.map(pid=>depth.get(pid)))+1;
        if((depth.get(childId)||0)<required){depth.set(childId,required);changed=true;}
      });
      if(!changed)break;
    }

    // Ширина поддерева рассчитывается снизу вверх; соседние поддеревья не накладываются.
    const subtreeWidth = new Map();
    const visiting = new Set();
    function measure(id){
      if(subtreeWidth.has(id)) return subtreeWidth.get(id);
      if(visiting.has(id)) return NODE_W; // защита от некорректного циклического ввода
      visiting.add(id);
      const kids = primaryChildren.get(id) || [];
      const widths = kids.map(measure);
      const childrenWidth = widths.reduce((sum,w)=>sum+w,0) + Math.max(0,kids.length-1)*GAP_X;
      const width = Math.max(NODE_W, childrenWidth);
      visiting.delete(id);
      subtreeWidth.set(id,width);
      return width;
    }
    measure(rootId);

    const centerX = new Map();
    function place(id,left){
      const width = subtreeWidth.get(id) || NODE_W;
      centerX.set(id,left+width/2);
      const kids = primaryChildren.get(id) || [];
      const widths = kids.map(k=>subtreeWidth.get(k)||NODE_W);
      const total = widths.reduce((sum,w)=>sum+w,0)+Math.max(0,kids.length-1)*GAP_X;
      let cursor = left+(width-total)/2;
      kids.forEach((kid,i)=>{
        place(kid,cursor);
        cursor += widths[i]+GAP_X;
      });
    }
    place(rootId,0);

    const maxD = Math.max(0,...depth.values());
    const nodes = new Map();
    include.forEach(id=>{
      const d = depth.get(id) || 0;
      const cx = centerX.has(id) ? centerX.get(id) : NODE_W/2;
      nodes.set(id,{x:cx-NODE_W/2,y:d*(NODE_H+GAP_Y)});
    });
    let minX=Infinity,maxX=-Infinity,maxY=0;
    nodes.forEach(n=>{minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x+NODE_W);maxY=Math.max(maxY,n.y+NODE_H)});
    nodes.forEach(n=>{n.x-=minX;});
    return {nodes,w:maxX-minX,h:maxY};
  }

  function openTreeView(centerId,rootId){
    if(!M.has(centerId)||!M.has(rootId)){toast('Не найдено');return}
    treeCenterId=centerId;
    treeRootId=rootId;

    const include=getBloodDescendants(rootId);
    const pathToCenter=findBloodPath(rootId,centerId)||[];
    const pathSet=new Set(pathToCenter);

    const NODE_W=140, NODE_H=34;
    const GAP_X=40, GAP_Y=120;

    const block = layoutTree(rootId, include, NODE_W, NODE_H, GAP_X, GAP_Y);

    const nodePos=new Map();
    block.nodes.forEach((pos,id)=>{
      nodePos.set(id,{
        x: pos.x,
        y: pos.y,
        isCenter: id===centerId,
        isRoot: id===rootId,
        onPath: pathSet.has(id)
      });
    });

    const edges=[];
    include.forEach(id=>{
      const p=M.get(id);if(!p)return;
      [p.father,p.mother].forEach(par=>{
        if(par!=null&&include.has(par)&&nodePos.has(par)&&nodePos.has(id)){
          edges.push({from:par,to:id,onPath:pathSet.has(par)&&pathSet.has(id)});
        }
      });
    });

    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    nodePos.forEach(n=>{
      minX=Math.min(minX, n.x);
      maxX=Math.max(maxX, n.x+NODE_W);
      minY=Math.min(minY, n.y);
      maxY=Math.max(maxY, n.y+NODE_H);
    });
    const pad=60;
    minX-=pad; maxX+=pad; minY-=pad; maxY+=pad;

    treeState={
      include, nodePos, edges,
      bbox:{minX,maxX,minY,maxY},
      nodeW:NODE_W, nodeH:NODE_H,
      panX:0, panY:0, scale:1,
      pathSet
    };
    treeRoutesCache=null;

    treeView.style.display='block';
    treeBar.style.display='flex';
    treeActive=true;
    document.getElementById('treeTitle').textContent='🌳 Древо от '+nm(M.get(rootId));
    renderTree();
    setTimeout(fitTree,30);
    if(renderer&&renderer.domElement){
      renderer.domElement.style.opacity='0.2';
      renderer.domElement.style.transition='opacity .3s';
    }
  }

  function closeTreeView(){
    treeView.style.display='none';
    treeBar.style.display='none';
    treeActive=false;treeState=null;treeRoutesCache=null;
    if(renderer&&renderer.domElement)renderer.domElement.style.opacity='1';
  }

  function fitTree(){
    if(!treeState)return;
    const st=treeState;
    const w=treeView.clientWidth,h=treeView.clientHeight;
    const bw=st.bbox.maxX-st.bbox.minX,bh=st.bbox.maxY-st.bbox.minY;
    const s=Math.min((w-60)/bw,(h-140)/bh,2.0);
    st.scale=s;
    const cx=(st.bbox.minX+st.bbox.maxX)/2,cy=(st.bbox.minY+st.bbox.maxY)/2;
    st.panX=w/2-cx*s;st.panY=(h+40)/2-cy*s;
    renderTree();
  }

  // ---------- ПРОКЛАДКА КРОВНЫХ СВЯЗЕЙ ----------
  // Основные линии идут общим коридором от родителя к его детям,
  // вместо отдельных диагональных/ломаных линий, которые пересекались между собой.
  function orthRoute(a, b, NODE_W, NODE_H, allNodes, idFrom, idTo, usedSegments, childIndex, totalChildren, busY){
    const sx = a.x + NODE_W/2;
    const sy = a.y + NODE_H;
    const fx = b.x + NODE_W/2;
    const fy = b.y;
    const laneY = Number.isFinite(busY) ? busY : sy + Math.max(10,(fy-sy)/2);
    return [{x:sx,y:sy},{x:sx,y:laneY},{x:fx,y:laneY},{x:fx,y:fy}];
  }

  // Скруглённый путь
  function roundedPath(points, r){
    if(points.length<2) return '';
    const pts = [points[0]];
    for (let i = 1; i < points.length; i++) {
      const prev = pts[pts.length - 1];
      if (Math.abs(points[i].x - prev.x) > 0.5 || Math.abs(points[i].y - prev.y) > 0.5) {
        pts.push(points[i]);
      }
    }
    if (pts.length < 2) return 'M' + pts[0].x + ',' + pts[0].y;
    let d = 'M' + pts[0].x + ',' + pts[0].y;
    for (let i = 1; i < pts.length - 1; i++) {
      const p0 = pts[i-1], p1 = pts[i], p2 = pts[i+1];
      const d1x = p1.x - p0.x, d1y = p1.y - p0.y;
      const d2x = p2.x - p1.x, d2y = p2.y - p1.y;
      const l1 = Math.hypot(d1x, d1y);
      const l2 = Math.hypot(d2x, d2y);
      const rr = Math.min(r, l1 / 2, l2 / 2);
      if (rr < 0.5 || l1 < 0.5 || l2 < 0.5) {
        d += ' L' + p1.x + ',' + p1.y;
      } else {
        const u1x = d1x / l1, u1y = d1y / l1;
        const u2x = d2x / l2, u2y = d2y / l2;
        const bx = p1.x - u1x * rr, by = p1.y - u1y * rr;
        const cx = p1.x + u2x * rr, cy = p1.y + u2y * rr;
        d += ' L' + bx + ',' + by + ' Q' + p1.x + ',' + p1.y + ' ' + cx + ',' + cy;
      }
    }
    const last = pts[pts.length-1];
    d += ' L' + last.x + ',' + last.y;
    return d;
  }

  function renderTree(){
    if(!treeState)return;
    const st=treeState;
    treeSvg.setAttribute('viewBox','0 0 '+treeView.clientWidth+' '+treeView.clientHeight);
    treeSvg.innerHTML='';
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform','translate('+st.panX+','+st.panY+') scale('+st.scale+')');
    treeSvg.appendChild(g);

    const NODE_W=st.nodeW, NODE_H=st.nodeH;
    const allNodes=st.nodePos;
    // Группируем связи по родителю и рисуем общий горизонтальный коридор для детей.
    // Супруги здесь не соединяются: отображаются только связи «родитель — ребёнок».
    const edgesByParent = new Map();
    st.edges.forEach(e=>{
      if(!edgesByParent.has(e.from)) edgesByParent.set(e.from,[]);
      edgesByParent.get(e.from).push(e);
    });
    const parentIds=[...edgesByParent.keys()].sort((a,b)=>{
      const ap=st.nodePos.get(a),bp=st.nodePos.get(b);
      return (ap?.y||0)-(bp?.y||0)||(ap?.x||0)-(bp?.x||0);
    });
    parentIds.forEach(parentId=>{
      const a=st.nodePos.get(parentId);
      if(!a)return;
      const list=edgesByParent.get(parentId).filter(e=>st.nodePos.has(e.to));
      list.sort((p,q)=>st.nodePos.get(p.to).x-st.nodePos.get(q.to).x);
      if(!list.length)return;
      const sy=a.y+NODE_H;
      const childY=Math.min(...list.map(e=>st.nodePos.get(e.to).y));
      // Коридор держим между поколениями. Соседние поддеревья получают отдельные X-диапазоны.
      const laneY=sy+Math.max(8,Math.min(24,(childY-sy)/3));
      const xs=list.map(e=>st.nodePos.get(e.to).x+NODE_W/2);
      const sx=a.x+NODE_W/2;
      const busLeft=Math.min(sx,...xs),busRight=Math.max(sx,...xs);
      const pathData='M'+sx+','+sy+' L'+sx+','+laneY+
        (Math.abs(busRight-busLeft)>0.5?' L'+busLeft+','+laneY+' L'+busRight+','+laneY:'');
      const trunk=document.createElementNS('http://www.w3.org/2000/svg','path');
      trunk.setAttribute('d',pathData);trunk.setAttribute('fill','none');
      trunk.setAttribute('stroke',list.some(e=>e.onPath)?'#ffb733':'#6f8296');
      trunk.setAttribute('stroke-width',list.some(e=>e.onPath)?'2.5':'1.2');
      trunk.setAttribute('stroke-linecap','round');trunk.setAttribute('stroke-linejoin','round');
      g.appendChild(trunk);
      list.forEach(e=>{
        const b=st.nodePos.get(e.to);if(!b)return;
        const x=b.x+NODE_W/2;
        const path=document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d','M'+x+','+laneY+' L'+x+','+b.y);
        path.setAttribute('fill','none');
        path.setAttribute('stroke',e.onPath?'#ffb733':'#6f8296');
        path.setAttribute('stroke-width',e.onPath?'2.5':'1.2');
        path.setAttribute('stroke-linecap','round');
        g.appendChild(path);
      });
    });

    // Узлы
    st.nodePos.forEach((n,id)=>{
      const p=M.get(id);if(!p)return;
      const x=n.x, y=n.y, w=st.nodeW, h=st.nodeH;
      let fill='#eeeae5', stroke='#7a7168';
      if(n.isCenter){fill='#ffffff';stroke='#00e5ff'}
      else if(n.isRoot){fill='#ffd966';stroke='#a87000'}
      else if(n.onPath){fill='#ffeebb';stroke='#c89000'}
      else if(p.Пол==='М'){fill='#dbe9f4';stroke='#5a6b7a'}
      else if(p.Пол==='Ж'){fill='#f6dde3';stroke='#7a5a65'}

      const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x',x);rect.setAttribute('y',y);
      rect.setAttribute('width',w);rect.setAttribute('height',h);
      rect.setAttribute('rx','6');rect.setAttribute('ry','6');
      rect.setAttribute('fill',fill);rect.setAttribute('stroke',stroke);
      rect.setAttribute('stroke-width',n.isCenter?2:1.2);
      rect.style.cursor='pointer';
      rect.onclick=()=>{select(id)};
      g.appendChild(rect);

      const t1=document.createElementNS('http://www.w3.org/2000/svg','text');
      const hasYears=!!(p['Дата рождения']||p['Дата смерти']);
      t1.setAttribute('x',x+w/2);
      t1.setAttribute('y',hasYears?y+h/2-3:y+h/2+1);
      t1.setAttribute('text-anchor','middle');
      t1.setAttribute('dominant-baseline','middle');
      t1.setAttribute('font-size','10');
      t1.setAttribute('font-family','-apple-system,Segoe UI,Arial');
      t1.setAttribute('fill','#1f1c18');
      if(n.isCenter)t1.setAttribute('font-weight','bold');
      t1.style.pointerEvents='none';
      let name=nm(p);
      if(name.length>18)name=name.slice(0,17)+'…';
      t1.textContent=name;
      g.appendChild(t1);

      const b=(p['Дата рождения']||'').toString().slice(0,4);
      const d=(p['Дата смерти']||'').toString().slice(0,4);
      if(b||d){
        const t2=document.createElementNS('http://www.w3.org/2000/svg','text');
        t2.setAttribute('x',x+w/2);
        t2.setAttribute('y',y+h/2+11);
        t2.setAttribute('text-anchor','middle');
        t2.setAttribute('font-size','8');
        t2.setAttribute('font-family','-apple-system,Segoe UI,Arial');
        t2.setAttribute('fill','#5c554d');
        t2.style.pointerEvents='none';
        t2.textContent=b+(d?'–'+d:'');
        g.appendChild(t2);
      }
    });
  }

  // ---------- Управление: пинч и панорама ----------
  (function initTreeInteractions(){
    const pointers=new Map();
    let isPinch=false;
    let pinchStartDist=0;
    let pinchStartScale=1;
    let dragStart=null;

    function dist(p1,p2){const dx=p1.x-p2.x,dy=p1.y-p2.y;return Math.sqrt(dx*dx+dy*dy)}
    function center(p1,p2){return {x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2}}

    treeSvg.addEventListener('pointerdown',e=>{
      if(!treeActive)return;
      treeSvg.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pointers.size===1){
        dragStart={x:e.clientX,y:e.clientY,panX:treeState.panX,panY:treeState.panY};
        isPinch=false;
      } else if(pointers.size===2){
        isPinch=true;dragStart=null;
        const pts=[...pointers.values()];
        pinchStartDist=dist(pts[0],pts[1]);
        pinchStartScale=treeState.scale;
      }
    });

    treeSvg.addEventListener('pointermove',e=>{
      if(!treeActive||!treeState)return;
      if(!pointers.has(e.pointerId))return;
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

      if(isPinch && pointers.size>=2){
        const pts=[...pointers.values()].slice(0,2);
        const d=dist(pts[0],pts[1]);
        if(pinchStartDist>0){
          const factor=d/pinchStartDist;
          const newScale=Math.max(0.05,Math.min(20,pinchStartScale*factor));
          const r=treeSvg.getBoundingClientRect();
          const c=center(pts[0],pts[1]);
          const cx=c.x-r.left, cy=c.y-r.top;
          const mx=cx-treeState.panX, my=cy-treeState.panY;
          const k=newScale/treeState.scale;
          treeState.panX=cx-mx*k;
          treeState.panY=cy-my*k;
          treeState.scale=newScale;
          renderTree();
        }
      } else if(!isPinch && pointers.size===1 && dragStart){
        const dx=e.clientX-dragStart.x;
        const dy=e.clientY-dragStart.y;
        treeState.panX=dragStart.panX+dx;
        treeState.panY=dragStart.panY+dy;
        renderTree();
      }
    });

    function endPointer(e){
      pointers.delete(e.pointerId);
      if(pointers.size<2)isPinch=false;
      if(pointers.size===0){dragStart=null}
      else if(pointers.size===1){
        const p=[...pointers.values()][0];
        dragStart={x:p.x,y:p.y,panX:treeState.panX,panY:treeState.panY};
      }
    }
    treeSvg.addEventListener('pointerup',endPointer);
    treeSvg.addEventListener('pointercancel',endPointer);
    treeSvg.addEventListener('pointerleave',endPointer);

    treeSvg.addEventListener('wheel',e=>{
      if(!treeState)return;
      e.preventDefault();
      const f=e.deltaY<0?1.12:0.9;
      const rect=treeSvg.getBoundingClientRect();
      const mx=e.clientX-rect.left;
      const my=e.clientY-rect.top;
      treeState.panX=mx-(mx-treeState.panX)*f;
      treeState.panY=my-(my-treeState.panY)*f;
      treeState.scale*=f;
      renderTree();
    },{passive:false});
  })();

  document.getElementById('treeBack').onclick=()=>closeTreeView();
  document.getElementById('treePng').onclick=()=>{pdfMenu.style.display='flex'};
  document.getElementById('pdfCancel').onclick=()=>{pdfMenu.style.display='none'};
  document.getElementById('pdfMake').onclick=()=>{pdfMenu.style.display='none';exportTreePDF()};

  // ---------- PDF ----------
  function exportTreePDF(){
    if(!treeState){toast('Дерево не открыто');return}
    if(typeof window.jspdf==='undefined'){toast('jsPDF не загрузился');return}

    const fmt=document.querySelector('input[name="pdfFormat"]:checked').value;
    const { jsPDF } = window.jspdf;
    const st=treeState;

    const bw0=st.bbox.maxX-st.bbox.minX;
    const bh0=st.bbox.maxY-st.bbox.minY;
    const isWide=bw0>bh0;

    let pdfW,pdfH;
    if(fmt==='a4'){ if(isWide){pdfW=297;pdfH=210}else{pdfW=210;pdfH=297} }
    else if(fmt==='a3'){ if(isWide){pdfW=420;pdfH=297}else{pdfW=297;pdfH=420} }
    else {
      const scaleMM=0.35;
      pdfW=Math.max(210,bw0*scaleMM+40);
      pdfH=Math.max(297,bh0*scaleMM+60);
    }

    const DPI=300;
    const PX_PER_MM=DPI/25.4;
    const cnvW=Math.round(pdfW*PX_PER_MM);
    const cnvH=Math.round(pdfH*PX_PER_MM);

    const cnv=document.createElement('canvas');
    cnv.width=cnvW;
    cnv.height=cnvH;
    const c=cnv.getContext('2d');
    c.fillStyle='#ffffff';
    c.fillRect(0,0,cnvW,cnvH);

    const padX=20*PX_PER_MM;
    const padTop=30*PX_PER_MM;
    const padBottom=15*PX_PER_MM;
    const availW=cnvW-padX*2;
    const availH=cnvH-padTop-padBottom;
    const bw=st.bbox.maxX-st.bbox.minX;
    const bh=st.bbox.maxY-st.bbox.minY;
    const scale=Math.min(availW/bw, availH/bh);
    const offsetX=padX+(availW-bw*scale)/2;
    const offsetY=padTop+(availH-bh*scale)/2;

    const titleFS=Math.round(14*PX_PER_MM/2.83);
    c.fillStyle='#111';
    c.font='bold '+titleFS+'px -apple-system, "Segoe UI", Arial, sans-serif';
    c.textAlign='center';
    c.fillText('Древо от '+nm(M.get(treeRootId)), cnvW/2, Math.round(padTop*0.5));

    const subFS=Math.round(9*PX_PER_MM/2.83);
    c.fillStyle='#666';
    c.font=subFS+'px -apple-system, "Segoe UI", Arial, sans-serif';
    c.fillText('Всего: '+st.include.size+' человек · '+new Date().toLocaleDateString('ru-RU'), cnvW/2, Math.round(padTop*0.8));

    c.save();
    c.translate(offsetX, offsetY);
    c.scale(scale, scale);

    const NODE_W=st.nodeW, NODE_H=st.nodeH;
    const allNodes = st.nodePos;
    const usedSegments = [];
    const edgesSorted = st.edges.map((e, i) => ({ edge: e, index: i }))
      .sort((p, q) => {
        const ap = st.nodePos.get(p.edge.from), bp = st.nodePos.get(q.edge.from);
        if ((ap?.y || 0) !== (bp?.y || 0)) return (ap?.y || 0) - (bp?.y || 0);
        if ((ap?.x || 0) !== (bp?.x || 0)) return (ap?.x || 0) - (bp?.x || 0);
        const ac = st.nodePos.get(p.edge.to), bc = st.nodePos.get(q.edge.to);
        return (ac?.x || 0) - (bc?.x || 0);
      });

    const edgesByParent = new Map();
    edgesSorted.forEach(({ edge: e }) => {
      if (!edgesByParent.has(e.from)) edgesByParent.set(e.from, []);
      edgesByParent.get(e.from).push(e);
    });
    edgesByParent.forEach((list) => {
      list.sort((p, q) => {
        const ap = st.nodePos.get(p.to), bp = st.nodePos.get(q.to);
        return (ap?.x || 0) - (bp?.x || 0);
      });
    });

    edgesSorted.forEach(({ edge: e }) => {
      const a = st.nodePos.get(e.from);
      const b = st.nodePos.get(e.to);
      if (!a || !b) return;
      const siblings = edgesByParent.get(e.from) || [];
      const childIndex = siblings.indexOf(e);
      const totalChildren = siblings.length;
      const pts = orthRoute(a, b, NODE_W, NODE_H, allNodes, e.from, e.to, usedSegments, childIndex, totalChildren);
      for (let i = 0; i < pts.length - 1; i++) {
        usedSegments.push({ x1: pts[i].x, y1: pts[i].y, x2: pts[i+1].x, y2: pts[i+1].y });
      }
      c.strokeStyle = e.onPath ? '#c88a00' : '#8899aa';
      c.lineWidth = e.onPath ? 2.4 : 1.2;
      c.beginPath();
      c.moveTo(pts[0].x, pts[0].y);
      for (let k = 1; k < pts.length; k++) c.lineTo(pts[k].x, pts[k].y);
      c.stroke();
    });

    st.nodePos.forEach((n,id)=>{
      const p=M.get(id);if(!p)return;
      const x=n.x,y=n.y,w=NODE_W,h=NODE_H;
      let fill='#eeeae5',stroke='#7a7168';
      if(n.isCenter){fill='#ffffff';stroke='#0099cc'}
      else if(n.isRoot){fill='#ffd966';stroke='#a87000'}
      else if(n.onPath){fill='#ffeebb';stroke='#c89000'}
      else if(p.Пол==='М'){fill='#dbe9f4';stroke='#5a6b7a'}
      else if(p.Пол==='Ж'){fill='#f6dde3';stroke='#7a5a65'}

      const rr=6;
      c.beginPath();
      c.moveTo(x+rr,y);
      c.arcTo(x+w,y,x+w,y+h,rr);
      c.arcTo(x+w,y+h,x,y+h,rr);
      c.arcTo(x,y+h,x,y,rr);
      c.arcTo(x,y,x+w,y,rr);
      c.closePath();
      c.fillStyle=fill;
      c.fill();
      c.strokeStyle=stroke;
      c.lineWidth=n.isCenter?2:1.2;
      c.stroke();

      c.fillStyle='#1f1c18';
      c.font=(n.isCenter?'bold ':'')+'10px -apple-system, "Segoe UI", Arial, sans-serif';
      c.textAlign='center';
      c.textBaseline='middle';
      let name=nm(p);
      if(name.length>18) name=name.slice(0,17)+'…';
      const hasYears=!!(p['Дата рождения']||p['Дата смерти']);
      c.fillText(name, x+w/2, hasYears?y+h/2-3:y+h/2+1);

      const b=(p['Дата рождения']||'').toString().slice(0,4);
      const d=(p['Дата смерти']||'').toString().slice(0,4);
      if(b||d){
        c.fillStyle='#5c554d';
        c.font='8px -apple-system, "Segoe UI", Arial, sans-serif';
        c.fillText(b+(d?'–'+d:''), x+w/2, y+h/2+11);
      }
    });

    c.restore();

    const imgData=cnv.toDataURL('image/png');
    const orient=pdfW>pdfH?'landscape':'portrait';
    const pdf=new jsPDF({orientation:orient,unit:'mm',format:[pdfW,pdfH]});
    pdf.addImage(imgData,'PNG',0,0,pdfW,pdfH);

    const stamp=new Date().toISOString().slice(0,10);
    const rootName=(M.get(treeRootId).Имя||'root').replace(/\s+/g,'_');
    pdf.save('tree_'+fmt+'_'+rootName+'_'+stamp+'.pdf');
    toast('PDF сохранён ✓');
  }

  // ---------- Карточка человека ----------
  function select(id){
    highlightSubtree(id);
    const p=M.get(id);if(!p)return;
    try{history.replaceState(null,'','#id='+id)}catch(_){}

    function statsFor(setIds){
      let males=0,females=0,unknown=0;
      setIds.forEach(mid=>{const q=M.get(mid);if(!q)return;if(q.Пол==='М')males++;else if(q.Пол==='Ж')females++;else unknown++});
      return {males,females,unknown,total:males+females+unknown};
    }
    const ancSet=ancestors(id),descSet=descendants(id),inLawSet=inLawCloud(id),lawAncSet=inLawAncestors(id);
    const ancStats=statsFor(ancSet),descStats=statsFor(descSet),inLawStats=statsFor(inLawSet),lawAncStats=statsFor(lawAncSet);
    const allSet=new Set([id,...ancSet,...descSet,...inLawSet,...lawAncSet]);
    const allStats=statsFor(allSet);

    const parn=x=>x&&M.has(x)?nm(M.get(x)):'';
    const allRows=[
      ['ID',p.ID],['ФИО',nm(p)],['Пол',p.Пол||''],['Род / ветка',p['Род / Ветка']||''],
      ['Отец',parn(p.father)],['Мать',parn(p.mother)],
      ['Рождение',(p['Дата рождения']||'').toString().slice(0,10)],
      ['Место',p['Место рождения']||''],
      ['Смерть',(p['Дата смерти']||'').toString().slice(0,10)]
    ];
    const rows=allRows.filter(r=>r[1]!==undefined&&r[1]!==null&&String(r[1]).trim()!=='');

    function statLine(label,s){
      const parts=[];
      if(s.males)parts.push('<span style="color:#7fd4ff">♂ '+s.males+'</span>');
      if(s.females)parts.push('<span style="color:#ff9ecb">♀ '+s.females+'</span>');
      if(s.unknown)parts.push('<span style="color:#b8b0a5">? '+s.unknown+'</span>');
      return '<div class="stat-line"><span class="stat-label">'+label+'</span><span class="stat-value">'+parts.join(' · ')+' <span class="stat-total">(всего '+s.total+')</span></span></div>';
    }
    const statsHtml='<div class="stats-block"><div class="stats-title">Статистика облака</div>'+
      statLine('Облако',allStats)+
      (ancStats.total?statLine('Предки',ancStats):'')+
      (descStats.total?statLine('Потомки',descStats):'')+
      (inLawStats.total?statLine('Свойственники',inLawStats):'')+
      (lawAncStats.total?statLine('Предки свойственников',lawAncStats):'')+'</div>';

    function listBlock(title,arr,kind){
      if(!arr.length)return '';
      const PREVIEW=5,preview=arr.slice(0,PREVIEW),rest=arr.slice(PREVIEW);
      const relColor=kind==='anc'?'#ffcc33':kind==='desc'?'#33ffb0':kind==='law'?'#ffa04d':kind==='lawAnc'?'#d18cff':'#9fb0bf';
      const row=d=>{
        const rel=relationLabel(id,d.ID);
        return '<div data-id="'+d.ID+'"><span>• '+nm(d)+' <span style="color:#5d6b78">('+d.ID+')</span></span><span class="rel-label" style="color:'+relColor+'">'+rel+'</span></div>';
      };
      let html='<div style="margin-top:8px;font-size:11px;color:#7d8a97">'+title+' ('+arr.length+'):</div><div class="tree-list">';
      html+=preview.map(row).join('');
      if(rest.length){html+='<div class="show-more">▾ Показать ещё '+rest.length+'</div><div class="hidden-rows" style="display:none">'+rest.map(row).join('')+'</div>'}
      html+='</div>';
      return html;
    }
    const ancList=[...ancSet].map(i=>M.get(i)).filter(Boolean);
    const descList=[...descSet].map(i=>M.get(i)).filter(Boolean);
    const inLawList=[...inLawSet].map(i=>M.get(i)).filter(Boolean);
    const lawAncList=[...lawAncSet].map(i=>M.get(i)).filter(Boolean);
    const treeHtml=
      listBlock('Предки',ancList,'anc')+
      listBlock('Потомки',descList,'desc')+
      listBlock('Свойственники',inLawList,'law')+
      listBlock('Предки свойственника',lawAncList,'lawAnc');

    const b=document.getElementById('info');
    const linkUrl=location.origin+location.pathname+'#id='+id;
    b.innerHTML=
      '<div id="infoHeader"><span style="color:#e8eef5;font-weight:650">'+nm(p)+'</span> <span class="toggle">▾ Развернуть</span></div>'+
      '<h2>'+nm(p)+'</h2>'+
      rows.map(r=>'<div class="row"><b>'+r[0]+'</b>'+r[1]+'</div>').join('')+
      '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'+
        '<button id="treeOpen" style="padding:6px 10px;font-size:11px">🌳 Древо</button>'+
        '<button id="copyLink" style="padding:6px 10px;font-size:11px">🔗 Ссылка</button>'+
      '</div>'+
      statsHtml+treeHtml+
      '<br><button id="closeInfo">Закрыть</button>';
    b.style.display='block';

    if(isMobile){b.classList.add('collapsed');const t=b.querySelector('#infoHeader .toggle');if(t)t.textContent='▴ Развернуть'}
    else b.classList.remove('collapsed');
    const hd=b.querySelector('#infoHeader');
    if(hd)hd.onclick=()=>{const cc=b.classList.toggle('collapsed');const t=b.querySelector('#infoHeader .toggle');if(t)t.textContent=cc?'▴ Развернуть':'▾ Свернуть'};
    b.querySelectorAll('.show-more').forEach(el=>{el.onclick=()=>{const h=el.parentElement.querySelector('.hidden-rows');if(h){h.style.display='block';el.style.display='none'}}});
    document.getElementById('closeInfo').onclick=deselect;
    const cBtn=b.querySelector('#copyLink');
    if(cBtn)cBtn.onclick=()=>{try{navigator.clipboard.writeText(linkUrl).then(()=>toast('Ссылка скопирована ✓'),()=>{const ta=document.createElement('textarea');ta.value=linkUrl;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('Ссылка скопирована ✓')})}catch(e){toast('Ошибка: '+e.message)}};
    const tBtn=b.querySelector('#treeOpen');
    if(tBtn)tBtn.onclick=()=>{openRootMenu(id)};
    b.querySelectorAll('.tree-list div[data-id]').forEach(el=>{
      el.onclick=()=>{const id2=parseInt(el.dataset.id,10);select(id2);const pos=positions.get(id2);if(pos){controls.target.copy(pos);camera.position.set(pos.x+200,pos.y+180,pos.z+300);controls.update()}};
    });
  }

  // ---------- Кнопки UI ----------
  function fit(){
    if(!positions.size)return;
    const box=new THREE.Box3();positions.forEach(v=>box.expandByPoint(v));
    const c=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z,200);const dist=maxDim*1.7;
    controls.target.copy(c);camera.position.set(c.x+dist*0.35,c.y+dist*0.35,c.z+dist*0.85);
    controls.update();syncZoomUI();
  }
  document.getElementById('fit').onclick=fit;
  document.getElementById('reset').onclick=()=>{controls.target.set(0,0,0);camera.position.set(0,700,1600);controls.update();syncZoomUI()};
  document.getElementById('top').onclick=()=>{controls.target.set(0,0,0);camera.position.set(0,2400,1);controls.update();syncZoomUI()};
  document.getElementById('save').onclick=()=>{const d={};positions.forEach((v,k)=>{d[k]={x:v.x,y:v.y,z:v.z}});try{localStorage.setItem(KEY_POS,JSON.stringify(d));toast('Позиции сохранены ✓')}catch(e){toast('Ошибка: '+e.message)}};
  document.getElementById('clear').onclick=()=>{if(!confirm('Сбросить позиции?'))return;try{localStorage.removeItem(KEY_POS)}catch(_){}savedPositions={};computeLayout();buildScene();fit();toast('Позиции сброшены')};

  (function initMobilePanel(){
    const body=document.getElementById('ctrlBody'),btn=document.getElementById('togglePanel');
    if(!body||!btn)return;
    if(window.innerWidth<=800){btn.onclick=()=>{const o=body.classList.toggle('open');btn.textContent=o?'✕ Скрыть меню':'☰ Меню'}}
    window.addEventListener('resize',()=>{
      isMobile=window.innerWidth<=800;
      if(treeActive){renderTree();fitTree()}
      if(window.innerWidth>800){body.style.display='flex';body.classList.remove('open');btn.style.display='none'}
      else {body.style.display='';btn.style.display='block';if(!body.classList.contains('open'))btn.textContent='☰ Меню'}
    });
  })();

  document.getElementById('routeBtn').onclick=()=>setRouteMode(!routeMode);
  document.getElementById('pngBtn').onclick=()=>{
    try{
      renderer.render(scene,camera);
      const url=renderer.domElement.toDataURL('image/png');
      const a=document.createElement('a');const n=new Date();
      const st=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')+'_'+String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0');
      a.href=url;a.download='rodoslovnaya_'+st+'.png';document.body.appendChild(a);a.click();document.body.removeChild(a);
      toast('PNG сохранён ✓');
    }catch(e){toast('Ошибка: '+e.message)}
  };

  document.getElementById('branchFilter').onchange=function(){
    activeBranch=this.value;
    const f=filterByBranch(currentData,activeBranch);
    buildGraph(f);computeLayout();buildScene();deselect();
    setTimeout(()=>{fit();syncZoomUI()},60);
    toast('Показано: '+(activeBranch==='__ALL__'?'все ветви':activeBranch)+' · '+f.length+' чел.');
  };

  // Поиск
  const searchInput=document.getElementById('search');
  const suggestBox=document.getElementById('suggestBox');
  function hideSuggest(){suggestBox.style.display='none'}
  function positionSuggestBox(){const r=searchInput.getBoundingClientRect();suggestBox.style.left=r.left+'px';suggestBox.style.top=(r.bottom+4)+'px'}
  searchInput.addEventListener('input',()=>{
    const q=searchInput.value.toLowerCase().trim();
    if(!q){hideSuggest();return}
    const m=P.filter(x=>nm(x).toLowerCase().includes(q)||String(x.ID).includes(q)).slice(0,12);
    if(!m.length){hideSuggest();return}
    positionSuggestBox();
    suggestBox.innerHTML=m.map(x=>{
      const p=M.get(x.ID);
      const br=(p['Род / Ветка']||'').trim();
      const y=(p['Дата рождения']?'★'+p['Дата рождения'].toString().slice(0,4):'')+(p['Дата смерти']?' †'+p['Дата смерти'].toString().slice(0,4):'');
      return '<div class="sug-item" data-id="'+p.ID+'"><div style="color:#e8eef5">'+nm(p)+' <span style="color:#5d6b78">('+p.ID+')</span></div><div style="font-size:10px;color:#7d8a97">'+y+(br?' · '+br:'')+'</div></div>';
    }).join('');
    suggestBox.style.display='block';
    suggestBox.querySelectorAll('.sug-item').forEach(el=>{
      el.onmouseenter=()=>el.style.background='#141c26';el.onmouseleave=()=>el.style.background='transparent';
      el.onclick=()=>{const id2=parseInt(el.dataset.id,10);searchInput.value=nm(M.get(id2));hideSuggest();select(id2);const pos=positions.get(id2);if(pos){controls.target.copy(pos);camera.position.set(pos.x+250,pos.y+200,pos.z+350);controls.update();syncZoomUI()}};
    });
  });
  searchInput.addEventListener('blur',()=>setTimeout(hideSuggest,180));
  searchInput.addEventListener('keydown',e=>{if(e.key==='Escape')hideSuggest();if(e.key==='Enter'){const f=suggestBox.querySelector('.sug-item');if(f)f.click()}});

  // Зум
  const zoomRange=document.getElementById('zoomRange'),zoomVal=document.getElementById('zoomVal');
  let baseDistance=1600;
  function applyZoomPercent(pct){const d=baseDistance*(100/Math.max(10,pct));const dir=camera.position.clone().sub(controls.target).normalize();camera.position.copy(controls.target).add(dir.multiplyScalar(d));controls.update()}
  function syncZoomUI(){const d=camera.position.distanceTo(controls.target);const pct=Math.round(100*(baseDistance/Math.max(50,d)));const cl=Math.max(10,Math.min(300,pct));zoomRange.value=cl;zoomVal.textContent=cl+'%'}
  zoomRange.addEventListener('input',()=>{const v=parseInt(zoomRange.value,10);zoomVal.textContent=v+'%';applyZoomPercent(v)});
  dom.addEventListener('wheel',()=>setTimeout(syncZoomUI,50));

  // Импорт XLSX
  document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
  document.getElementById('fileInput').addEventListener('change',async function(){
    const file=this.files&&this.files[0];if(!file)return;
    if(typeof XLSX==='undefined'){toast('SheetJS не загрузился');return}
    try{
      showLoading('Читаю файл…');
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array',cellDates:true});
      const sn=wb.SheetNames[0];const sh=wb.Sheets[sn];
      const rows=XLSX.utils.sheet_to_json(sh,{defval:'',raw:false});
      const mapped=rows.map(r=>{
        const o={};Object.keys(r).forEach(k=>{let kk=String(k).trim();if(kk==='Род/Ветка')kk='Род / Ветка';o[kk]=r[k]==null?'':String(r[k]).trim()});return o;
      }).filter(o=>String(o.ID||'').trim()!=='');
      if(!mapped.length)throw new Error('Нет строк с ID');
      mapped.forEach(o=>{['Дата рождения','Дата смерти'].forEach(k=>{if(o[k]&&o[k].length>10)o[k]=o[k].slice(0,10)})});
      showLoading('Применяю '+mapped.length+' человек…');
      localStorage.setItem(KEY_DATA,JSON.stringify(mapped));
      applyData(mapped);hideLoading();
      toast('Импортировано: '+mapped.length+' человек');
    }catch(err){hideLoading();console.error(err);toast('Ошибка: '+(err.message||err),4000);const el=document.getElementById('err');el.style.display='block';el.textContent='Ошибка импорта:\n'+(err.stack||err)}
  });
  document.getElementById('resetData').onclick=()=>{if(!confirm('Вернуть встроенные данные?'))return;try{localStorage.removeItem(KEY_DATA)}catch(_){}applyData(BUILTIN_P);toast('Восстановлены встроенные')};

  function filterByBranch(arr,branch){if(!branch||branch==='__ALL__')return arr;return arr.filter(p=>(p['Род / Ветка']||'').trim()===branch)}

  function applyData(arr){
    currentData=arr;
    const branches=new Set();
    arr.forEach(p=>{const b=(p['Род / Ветка']||'').trim();if(b)branches.add(b)});
    const sel=document.getElementById('branchFilter');
    if(sel){
      const sorted=[...branches].sort();
      sel.innerHTML='<option value="__ALL__">Все ветви ('+arr.length+')</option>'+sorted.map(b=>{const n=arr.filter(x=>(x['Род / Ветка']||'').trim()===b).length;return '<option value="'+b.replace(/"/g,'&quot;')+'">'+b+' ('+n+')</option>'}).join('');
      if([...sel.options].some(o=>o.value===activeBranch))sel.value=activeBranch;else{activeBranch='__ALL__';sel.value='__ALL__'}
    }
    const f=filterByBranch(arr,activeBranch);
    buildGraph(f);computeLayout();buildScene();
    setTimeout(()=>{
      fit();syncZoomUI();
      const m=location.hash.match(/#id=(\d+)/);
      if(m){const t=parseInt(m[1],10);if(M.has(t)){select(t);const p=positions.get(t);if(p){controls.target.copy(p);camera.position.set(p.x+250,p.y+200,p.z+350);controls.update()}}}
    },120);
  }

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    if(treeActive){treeSvg.setAttribute('viewBox','0 0 '+treeView.clientWidth+' '+treeView.clientHeight);fitTree()}
  });

  function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}

  let initial=BUILTIN_P;
  try{const s=localStorage.getItem(KEY_DATA);if(s){const a=JSON.parse(s);if(Array.isArray(a)&&a.length)initial=a}}catch(_){}
  applyData(initial);
  animate();

}catch(err){
  const el=document.getElementById('err');
  el.style.display='block';
  el.textContent='Ошибка инициализации:\n'+(err&&err.stack?err.stack:err);
  console.error(err);
}
})();
</script>
</body></html>
